# The hardware spike of the PACEMAKER experiment (docs/pacemaker/tasks.md,
# task 1). Its own workspace, outside rsk's: a privileged bare-metal program
# with raw register access, so none of rsk's unsafe-code gates apply to it
# and nothing of it is carried into the Application.
[workspace]

[package]
name = "pm-timer-spike"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
# Task 1.3 runs the Application's own driver (the sequences of "Arming and
# the lead") on the board's registers. The spike takes nothing else of the
# Application, and nothing of the spike goes into it.
pm-core = { path = "../../crates/pm-core", optional = true }
pm-hw = { path = "../../crates/pm-hw", optional = true }

[features]
# Task 1.2: after the start-up writes the program idles, and the host script
# `probe_1_2.py` drives every register through the debug probe.
idle = []
# Task 1.3: the write order of "Arming and the lead" swept toward the
# present under an injected interrupt; `lead_check.py` reads the result.
lead = ["dep:pm-core", "dep:pm-hw"]

[profile.release]
panic = "abort"
opt-level = 2
debug = 2
lto = false

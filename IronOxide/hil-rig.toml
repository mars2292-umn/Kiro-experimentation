# The HIL_Rig (task 7.1; design.md "Profile_Conformance_Suite and HIL_Rig";
# Verification_Plan section 11): the bench the HIL steps of the verification
# job use. `rsk-hil` reads this file; `cargo xtask hil` and the job's step
# "HIL: rig self-test" select every probe by serial (never by its position
# in `probe-rs list`) and refuse to run when a role's board is absent.
schema = "rsk-hil-rig/1"
chip = "nRF52840_xxAA"

# The boards: J-Link on-board probes as `VID:PID:SERIAL` (`probe-rs list`).
[boards.target]
serial = "1366:1060:001050217737"
board = "PCA10056 v3.0.3, nRF52840 AAF0"

[boards.stimulus]
serial = "1366:1061:001050279833"
board = "PCA10056 v3.0.3, nRF52840 AAF0"
# The stimulus Application (an rsk Application, `apps/hil-stimulus`).
bin = "hil-stimulus"

[boards.spare]
serial = "1366:1061:001050211852"
board = "PCA10056 v3.0.3, nRF52840 AAF0"
wired = false

# The logic analyzer: an fx2lafw device (Saleae Logic compatible) through
# sigrok-cli; its channels are D0 to D7. The self-test captures the
# stimulus mirror and the response line.
[analyzer]
driver = "fx2lafw"
samplerate_hz = 2000000
stimulus_channel = 6
response_channel = 0
# The target's trace pins (rsk-kernel feature `trace-pins`): the executing
# Task's index on three channels (bit 0 first; 7 = none) and the
# Kernel-active flag.
task_id_channels = [1, 2, 3]
kernel_channel = 4

# The wiring, as the rig's discovery pass of 2026-11-01 measured it (each
# board driving each header pin in turn while the other board's inputs and
# the analyzer were read): Arduino-header names in parentheses.
[wiring]
# Board to board, the same pin number on both DKs.
stimulus_line = "P1.01 (D0): stimulus -> target, the GPIOTE input of the target's `pulse` Task"
board_spares = ["P1.02 (D1)", "P1.03 (D2)", "P1.04 (D3)"]
# Stimulus board to the analyzer.
stimulus_mirror = "stimulus P1.05 (D4) -> analyzer D6, driven in the same register write as the stimulus line"
stimulus_spare = "stimulus P1.06 (D5) -> analyzer D7"
# Target to the analyzer.
response_line = "target P1.10 (D8) -> analyzer D0, toggled by every `pulse` Job"
target_spares = ["P1.11 (D9) -> D1", "P1.12 (D10) -> D2", "P1.13 (D11) -> D3", "P1.14 (D12) -> D4", "P1.15 (D13) -> D5"]
ground = "common ground across both boards and the analyzer"

# What the self-test's loopback expects: the stimulus period and pulse
# width (apps/hil-stimulus), the target's `pulse` deadline (15 ms) as the
# bound on every response, and the least matched pulses of a 200 ms run.
[expect]
period_ms = 18
pulse_us = 100
response_deadline_ms = 15
min_matched = 9
# R9.10: the bound on the lag from a periodic nominal instant to the
# Release becoming effective, in CPU cycles, as the Kernel's own record
# measures it in a HIL build (with the trace instrumentation's cost).
# Measured: 5,687 cycles in the first short run (89 µs; the tick that
# releases five Tasks at once), 6,789 over the PAR-05 hour (task 7.3), and
# 8,103 under the stress configuration (task 7.5: the lower-criticality
# Partitions restarting and the source stormed); the job's placeholder of
# 500 cycles is far below it; the rig writes the measured value with the
# margin of R34.6 to docs/hil/kernel_timing_<variant>.json for the Analyzer
# (task 19.3), and fails a run whose observed maximum exceeds this bound
# (R13.4).
j_rel_cycles = 10000
# R19.3, R13.4: the exported bound on one run of the intake handler for a
# stormed source (Δ_irq), in CPU cycles, as the Kernel's own record
# measures it in a HIL build: 2,025 to 2,068 cycles observed (31.6 to
# 32.3 µs) over the short and hour-long stress runs of task 7.5. The rig
# fails a run whose observed maximum exceeds it, and the record it writes
# for the Analyzer (task 19.3) carries the observed maximum with the
# margin of R34.6.
delta_irq_cycles = 2600
# Task 19.2 (2026-11-06): the exported bound of L_kernel. Since 2026-11-07
# (Verification_Plan 11.13) the longest masked span measured end to end
# by the HIL build (`ARCH_SPAN`: tail-chained entries and unwinds inside
# one span): 18,748 cycles in the timing-short run and 26,123 in the
# hour-long stress run (a timer entry ending a
# Job, unwinding it, and tail-chaining into the next dispatch), plus
# Δ_entry's 1,765, with the margin. Before: the longest single entry,
# 4,340 to 4,498 cycles. With Δ_irq it bounds the lag from a Release_Source
# edge to the Kernel's timestamp (Δ_stamp): the loopback step allows a wire
# latency later than the deadline by at most this lag when the Kernel
# logged no deadline miss.
l_kernel_cycles = 35000
# Δ_stamp (Table 13-1), measured since 2026-11-06 by the probe (PPI routes
# the stimulus edge to a TIMER0 capture; the intake handler records the lag
# to its timestamp): 3,112 cycles (48.6 µs) over 10,000 edges of the plain
# measurement run, 4,908 (76.7 µs) under the release-timing configuration
# (its 12 ms Critical_Section and late Jobs make the entry that masks the
# edge longer). The bound covers every measurement configuration, below
# L_kernel plus Δ_irq. The loopback step allows a wire answer later than
# the deadline by at most this when the Kernel logged no miss, and fails a
# run whose observed lag exceeds it (R13.4).
delta_stamp_cycles = 8000

# Task 19.2 (R34.9): the Application loops whose Loop_Bound_Annotation no
# input reaches, with the justification the Verification_Plan records
# (section 11.13). Every loop of the demo is a wait by the time base with
# an iteration guard as the PR-16 backstop: the guard is one to four
# orders of magnitude above the iterations the wait takes (each iteration
# reads the time base through an SVC, some hundreds of cycles), so only a
# stopped time base reaches it. The rig's loop report (`cargo xtask hil
# --release-timing|--stress`) fails a loop below its bound that is not
# listed here, and any loop above it (R35.4).
[loops]
unreachable = [
  { key = "loop:part0:spin_ms:spin", reason = "a wait of up to 120 ms by the time base (about 300,000 SVC-paced iterations); the 100,000,000-iteration guard is the PR-16 backstop" },
  { key = "loop:part1:spin_ms:spin", reason = "a wait of up to 25 ms by the time base; the 100,000,000-iteration guard is the PR-16 backstop" },
  { key = "loop:part2:spin_ms:spin", reason = "a wait of up to 50 ms by the time base; the 100,000,000-iteration guard is the PR-16 backstop" },
  { key = "loop:part0:sensor:hold", reason = "the Critical_Section's 6 or 12 ms by the time base; the 10,000,000-iteration guard is the PR-16 backstop" },
  { key = "loop:part0:sensor:late", reason = "the injected late Job's 38 ms by the time base; the 50,000,000-iteration guard is the PR-16 backstop" },
  { key = "loop:part1:log:busy", reason = "3 ms by the time base; the 10,000,000-iteration guard is the PR-16 backstop" },
  { key = "loop:part2:filter:hold", reason = "a hold of 250 µs or 1 ms by the time base; the 10,000,000-iteration guard is the PR-16 backstop" },
]

# Task 19.2 (R34.4): the branch-coverage threshold of the measurement
# inputs, in percent of the branch outcomes of the functions a Task's Jobs
# reach in its crate (the Link_Checker's call graph), as the
# Verification_Plan records it (section 11.13): 50 % for Phase 3, every
# uncovered outcome listed in the run's report and justified in the plan
# (the fault paths and the PR-16 backstop guards the configuration cannot
# drive). `cargo xtask hil --coverage [--stress]` fails an item below it.
[coverage]
branch_percent = 50

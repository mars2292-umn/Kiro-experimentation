# jorvik: "Same" | "Relaxed" | "Kept (deviation)"

[[d13]]
item = "Task_Dispatching_Policy (FIFO_Within_Priorities)"
kind = "pragma"
classification = "Deviation"
cites = ["R7.1", "R7.2", "R7.3", "R29.1"]
treatment = "Fixed-priority preemptive SRP dispatch (Requirement 7)."
difference = "Eligible equal-priority Jobs start in the NVIC's fixed exception-number order, which the Generator assigns in declaration order (DD-03, the resolution of ORQ-17), not in FIFO order of release."
rationale = "The dispatch mechanism of DD-01 lets the interrupt controller arbitrate; emulating FIFO_Within_Priorities would add Kernel work to every Release. The order depends only on Generated_Config and on the release instants (R7.3)."
constrained_by = ["R29.1"]
constraint_note = "R29.1's hep(i) includes every equal-priority Task, so the Analyzer accounts for interference whatever the order."
jorvik = "Same"

[[d13]]
item = "Locking_Policy (Ceiling_Locking)"
kind = "pragma"
classification = "Deviation"
cites = ["PR-05", "PR-06", "PR-22", "R8.7"]
treatment = "PR-05, PR-06, PR-22, Requirement 8 (SRP). Ceilings are computed at build time from the declared accessors (PR-06, R8.7), so no Job locks a Resource whose Ceiling is below the Job's Priority."
difference = "A Job may enter a nested Critical_Section on a Resource whose Ceiling is below that of an enclosing Critical_Section, which Ceiling_Locking treats as a ceiling violation that raises Program_Error [RN-42]."
rationale = "On one core R8.1 keeps the System_Ceiling at the maximum held Ceiling, as RTIC's BASEPRI_MAX lock does [RN-07]."
constrained_by = ["R8.3", "R8.4", "R8.5"]
jorvik = "Same"

[[d13]]
item = "Detect_Blocking"
kind = "pragma"
classification = "Enforced"
cites = ["PR-08"]
treatment = "PR-08 (static rejection at build time instead of run-time detection)."
jorvik = "Same"

[[d13]]
item = "No_Abort_Statements"
kind = "restriction"
classification = "Deviation"
cites = ["PR-02", "R14.5", "R14.9", "R18.4"]
treatment = "PR-02: the Application has no operation that aborts a Task."
difference = "A Health_Monitor action can end a Job before it reaches its Release_Point (R4.7): END_JOB ends the running Job; RESTART_PARTITION and STOP_PARTITION end every Job of the Partition; SAFE_STATE stops every Release."
rationale = "Fault containment and temporal partitioning between Partitions (Requirements 14 and 18)."
constrained_by = ["R14.9", "R18.4"]
jorvik = "Same"


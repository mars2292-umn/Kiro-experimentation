# Toolchain decision record (task 1.1; R55.2, R55.5, R56.1).
#
# `cargo xtask verify` reads [pin] and fails unless rust-toolchain.toml, the
# active rustc, and every workspace crate's edition agree with it. The other
# tables document the decision. Facts were checked on 2026-10-08 (the
# [verus_toolchain] and [kani] pins on 2026-10-11) and are rephrased from the
# sources for licensing compliance.

schema = 1
checked = "2026-10-08"

[pin]
# R55.2: before Phase P5, the Kernel builds with the upstream stable rustc on
# which the Qualified_Toolchain is based.
upstream_rustc = "1.95.0"
# R55.5: one edition for all rsk crates, supported by both toolchains.
edition = "2021"
targets = ["thumbv7em-none-eabihf"]

[qualified_toolchain]
# Taken as the "planned" release: the newest released Ferrocene that
# qualifies thumbv7em-none-eabihf (assumption TC-ASM-01).
release = "Ferrocene 26.05.0"
based_on = "Rust 1.95.0"
target = "thumbv7em-none-eabihf"
qualified_host = "x86_64-unknown-linux-gnu"
sources = ["FER-INDEX", "FER-2605-NOTES", "FER-2605-BLOG", "FER-TARGETS"]

[verus_toolchain]
# Selected in task 4.1: the Verus release the Kernel_Proofs run with. CI
# installs it (.github/workflows/verify.yml, VERUS_RELEASE) and every proof
# Evidence_Item records it (R44.6). Its rustc and Z3 come with the release.
release = "0.2026.10.04.426d8b0"
pinned_rustc = "1.98.1"
z3 = "4.16.0"
sources = ["VERUS-PINNED-RELEASE", "VERUS-TOOLCHAIN", "VERUS-RELEASES"]
# The newest rolling release when the toolchain was first checked
# (2026-10-08). It pins the same rustc; it is not the release in use.
newest_checked = "release/rolling/0.2026.10.08.956d529"

[kani]
# Task 6.1: the Kani_Harnesses run with this Kani release and the CBMC that
# `cargo kani setup` installs for it. CI installs it with
# `cargo install --locked` (.github/workflows/verify.yml, KANI_VERSION), and
# the Kani Evidence_Item records both versions (R45.7).
version = "0.68.0"
cbmc = "6.11.0"
sources = ["KANI-VERSIONS"]

[creusot]
# Task 17.1 (2026-10-23): the App_Prover (Verification_Plan section 7,
# ORQ-10) as installed on the development machine from a local checkout of
# the Creusot repository; `cargo creusot version` reports these. The
# checkout is a development build 131 commits after the v0.14.0 tag, not a
# release, so the pin is the commit. The checkout's Cargo.lock was modified
# locally at the time of pinning (recorded; the sources were not). Creusot
# drives its own rustc (nightly-2026-08-03), not the 1.95.0 of the
# Flight_Build nor the 1.98.1 of Verus; the proofs therefore speak about
# the source as compiled by that nightly (ORQ-08, Verification_Plan 9.3).
# cvc5 prints a multi-line banner that `cargo creusot version` reports as
# "bad CVC5 version"; the version is 1.4.1, the one Creusot recommends.
version = "0.15.0-dev"
commit = "18f2d371ecb0019d37ecbd25e67f474bed2dda00"
describe = "v0.14.0-131-g18f2d371e"
checkout = "/Users/mars2292/repos/Kiro-experimentation/creusot"
checkout_dirty = ["Cargo.lock"]
pinned_rustc = "nightly-2026-08-03"
why3 = "1.8.2+git"
why3find = "1.3.0+dev"
solvers = { alt-ergo = "2.6.4", z3 = "5.1.0", cvc4 = "1.8", cvc5 = "1.4.1" }
# A Creusot project depends on creusot-std by path (the `cargo creusot
# config` global `[patch.crates-io]` entry was removed from
# ~/.cargo/config.toml on 2026-10-23: cargo records an unused global patch
# in every project's Cargo.lock, which broke this workspace's `--frozen`
# builds). A `*` requirement does not match the 0.15.0-dev prerelease.
creusot_std = "path: <checkout>/creusot-std (0.15.0-dev, edition 2024)"
# Confirmed on 2026-10-23 with a scratch crate: a `#![no_std]` crate with
# `requires`, `ensures`, and a loop `invariant` proves ("Proved (2 files)")
# with no network access; an unguarded `u32` addition fails its goal, so
# arithmetic overflow is checked by default.
confirmed = ["no_std", "overflow-checked", "offline"]
sources = ["CREUSOT-VERSION-CMD"]

[edition]
chosen = "2021"
sources = ["FLS-SCOPE", "VERUS-VSTD", "VERUS-TEST-EDITIONS"]
rationale = """
Both rustc 1.95.0 and 1.98.1 accept editions 2015 to 2024. Edition 2021 is
chosen because the language specification that accompanies Ferrocene's
qualified compiler (the FLS) specifies programs of the 2021 Edition, and Verus
handles 2021 crates (vstd itself is a 2021 crate). Revisit when the FLS
covers edition 2024 (TC-ASM-03)."""

[gap]
verus_vs_qualified = """
Verus pins rustc 1.98.1; the Ferrocene 26.05.0 base is rustc 1.95.0. rsk code
must compile on both: rust-version = 1.95.0 and the verification job's 1.95.0
build reject language and library features stabilized after 1.95.0, but code
that 1.95.0 accepts and 1.98.1 rejects (new lints, future-incompatibility
errors) is caught only once the Verus build runs (task 4.1). The rustc
difference itself is ORQ-08 (property preservation, R52.3)."""

[[sources]]
id = "FER-INDEX"
url = "https://public-docs.ferrocene.dev/main/release-notes/index.html"
fact = "The release notes index lists 26.05.0 as the newest release; the 26.08 and 26.11 series are marked upcoming."

[[sources]]
id = "FER-2605-NOTES"
url = "https://public-docs.ferrocene.dev/main/release-notes/26.05.0.html"
fact = "The 26.05.0 notes carry upstream Rust changes through 1.95.0, and state that thumbv7em-none-eabihf with -C target-cpu=cortex-m4 replaces the retired thumbv7em-m4-none-eabihf qualified target."

[[sources]]
id = "FER-2605-BLOG"
url = "https://ferrous-systems.com/blog/ferrocene-26-05-0/"
fact = "Ferrocene 26.05.0 (July 2026) includes Rust 1.93.0 to 1.95.0; qualified for ISO 26262 ASIL D, IEC 61508 SIL 3, IEC 62304 Class C; supports customer efforts toward IEC 61508 SIL 4 and DO-178C DAL C."

[[sources]]
id = "FER-TARGETS"
url = "https://public-docs.ferrocene.dev/main/user-manual/targets/index.html"
fact = "The main-branch User Manual lists thumbv7em-none-eabihf as a qualified target only when cross-compiled from x86-64 Linux (glibc); Apple Silicon macOS is a quality-managed host."

[[sources]]
id = "FLS-SCOPE"
url = "https://public-docs.ferrocene.dev/main/specification/general.html"
fact = "The specification bundled with Ferrocene covers programs written in the 2021 Edition of Rust."

[[sources]]
id = "VERUS-TOOLCHAIN"
url = "https://raw.githubusercontent.com/verus-lang/verus/956d529b98140c68a5d6b9e2bdcdc3db215f7320/rust-toolchain.toml"
fact = "Verus pins channel 1.98.1 at commit 956d529 (the 2026-10-08 rolling release); main pins the same version."

[[sources]]
id = "VERUS-RELEASES"
url = "https://github.com/verus-lang/verus/releases/tag/release/rolling/0.2026.10.08.956d529"
fact = "Latest Verus rolling release at the time of the decision."

[[sources]]
id = "VERUS-PINNED-RELEASE"
url = "https://github.com/verus-lang/verus/releases/tag/release/0.2026.10.04.426d8b0"
fact = "The release's version.json records Verus 0.2026.10.04.426d8b0 (commit 426d8b0) on toolchain 1.98.1; its bundled Z3 reports version 4.16.0 (checked 2026-10-11 from the arm64-macos asset)."

[[sources]]
id = "KANI-VERSIONS"
url = "https://github.com/model-checking/kani/releases/tag/kani-0.68.0"
fact = "`cargo kani --version` with kani-verifier 0.68.0 installed reports Kani Rust Verifier 0.68.0 and CBMC 6.11.0 (checked 2026-10-11 on the development host; the same versions are recorded in the proof-kernel-kani Evidence_Item)."

[[sources]]
id = "VERUS-VSTD"
url = "https://raw.githubusercontent.com/verus-lang/verus/956d529b98140c68a5d6b9e2bdcdc3db215f7320/source/vstd/Cargo.toml"
fact = "vstd is an edition 2021 crate."

[[sources]]
id = "VERUS-TEST-EDITIONS"
url = "https://raw.githubusercontent.com/verus-lang/verus/956d529b98140c68a5d6b9e2bdcdc3db215f7320/source/rust_verify_test/tests/common/mod.rs"
fact = "The Verus test harness accepts --edition 2018, 2021, and 2024 options."

[[assumptions]]
id = "TC-ASM-01"
text = "The spec names no Ferrocene release for Phase P5. The planned release is taken to be the newest released one that qualifies thumbv7em-none-eabihf (26.05.0). Task 23.1 pins the release current at P5, and this pin moves with it."

[[assumptions]]
id = "TC-ASM-02"
text = "Rust 1.95.0 is inferred as the base because the 26.05.0 notes and announcement carry upstream changes through 1.95.0. Ferrocene patches the compiler, so upstream 1.95.0 is not identical to Ferrocene 26.05.0."

[[assumptions]]
id = "TC-ASM-03"
text = "Edition 2021 is taken to be inside Ferrocene's qualification scope because its specification covers the 2021 Edition. No public statement about edition 2024 was found."

[[assumptions]]
id = "TC-ASM-04"
text = "The Verus rustc is what Verus pins today; the Verus release selected in task 4.1 may pin a different rustc, which would change the gap above."

[[unverified]]
text = "The release-specific 26.05 User Manual (target list and qualified host) is customer-only (docs.ferrocene.dev); the public list above is the main branch."

[[unverified]]
text = "Whether the upcoming Ferrocene 26.08 changes the base rustc, and whether its Safety Manual adds constraints on editions."

[aeneas]
# Task 17.3 (2026-10-26): Aeneas, evaluated on one pure control law as a
# Lean-level alternative to the App_Prover for small computations
# (Verification_Plan section 7). Installed from a local checkout next to the
# repository (`../aeneas`, with Charon in `../aeneas/charon`), as Creusot
# is; neither is a release, so the pins are commits. Charon drives its own
# pinned rustc nightly; the Lean library requires Mathlib at the revision
# its lake-manifest records. The translation of `proofs/aeneas/controllaw`
# is committed (`proofs/aeneas/lean/ControlLaw/ControlLaw.lean`), so the
# verification job needs only Lean (elan) and the checkout's Lean library
# to check the proofs (step "Aeneas evaluation").
aeneas_commit = "472b3d5"
aeneas_describe = "Merge pull request #1476 from oliver-butterley/ci-warning-check"
charon_commit = "40ca4ab6c10ecb7629320d6eccc0f41423fbe889"
charon_rustc = "nightly-2026-09-17"
lean = "leanprover/lean4:v4.35.0"
mathlib = "56a005855ea17e0b0958f73ec801ae140b0a1679"
checkout = "/Users/mars2292/repos/Kiro-experimentation/aeneas"
# Result (Verification_Plan 7.1): the PI step's translation and its Lean
# proofs check; no floating point; evaluation only, no credit claimed.
result = "proofs/aeneas/lean builds; proof-app-aeneas passes"

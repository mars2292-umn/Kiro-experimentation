[package]
name = "p1-demo-part1"
description = "P1 demo Partition 1 (level C): the log Task"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# The nRF52840-DK variant: TIMER1 releases `pulse` (with the declaration's variant).
nrf52840 = ["p1-demo-decl/nrf52840"]

[dependencies]
p1-demo-decl = { path = "../decl" }
rsk = { path = "../../../crates/rsk" }

# `cfg(creusot)` is set by the App_Prover's compiler (task 17.1): the glue
# the Generator emits is excluded under it.
[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(creusot)"]

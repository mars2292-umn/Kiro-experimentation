[package]
name = "p1-demo-part1"
description = "P1 demo Partition 1 (level C): the log Task"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# The nRF52840-DK variant: the HIL_Rig's stimulus line on GPIOTE releases `pulse` (with the declaration's variant).
nrf52840 = ["p1-demo-decl/nrf52840"]
# The fault-injection suite (task 7.5): the response and stress configurations' injections.
response = []
# The isolation suite (task 7.4): the access matrix and the DMA cases.
isolation = ["rsk/hw-dt"]
# The cycle-attribution test (task 7.5, R18.1): a fixed-iteration spin per Job.
cycles = []
stress = []
# The measurement configurations (task 19.2, R34.9, R35.4): the loop report.
measure = []
# Task 21.2: the `telemetry` Endpoint of the QEMU configuration (`log` receives).
telemetry = []
# Task 21.4: the QEMU configuration's injected Endpoint faults (the dropped role state of task 21.3 and the rejected reply of task 21.4), never in a HIL build.
qemu-inject = []
# Task 21.6 (A-P7, Verification_Plan 5.15): the flood configuration, `log` answers every `pingpong` request with an invalid reply.
qemu-flood = []
# Task 21.6 (R41.3): the gated Endpoints `relay` and `report` of the QEMU and plain measurement configurations (`log` plays `relay`'s ctl after its `pingpong` receive).
gating = ["telemetry"]

[dependencies]
p1-demo-decl = { path = "../decl" }
rsk = { path = "../../../crates/rsk" }

# `cfg(creusot)` is set by the App_Prover's compiler (task 17.1): the glue
# the Generator emits is excluded under it.
[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(creusot)"]

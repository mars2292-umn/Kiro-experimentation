[package]
name = "p1-demo-decl"
description = "P1 demo App_Declaration: the single `rsk::app!` source of the system crate's tables, the Partition manifests, the Task_Model and the linker script"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# The nRF52840-DK variant of the declaration (`src/nrf52840.rs`).
nrf52840 = []
# The release-timing configurations of task 7.3 (`src/nrf52840_timing*.rs`),
# the nRF52840-DK variant with a long operating duration; one at a time.
nrf52840_timing = ["nrf52840"]
nrf52840_timing_short = ["nrf52840"]
# The fault-injection configurations of task 7.5 (`src/nrf52840_response.rs`,
# `src/nrf52840_stress*.rs`); one at a time.
nrf52840_response = ["nrf52840"]
nrf52840_stress = ["nrf52840"]
nrf52840_stress_short = ["nrf52840"]
# The isolation configuration of task 7.4 (`src/nrf52840_isolation.rs`).
nrf52840_isolation = ["nrf52840"]
# The cycle-attribution configuration of task 7.5 (`src/nrf52840_cycles.rs`).
nrf52840_cycles = ["nrf52840"]

[dependencies]
rsk = { path = "../../../crates/rsk" }

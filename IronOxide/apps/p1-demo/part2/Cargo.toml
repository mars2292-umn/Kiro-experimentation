[package]
name = "p1-demo-part2"
description = "P1 demo Partition 2 (level B): the FPU-using filter Task and the EasyDMA sampler Task (task 14, R3.7)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# The fault-injection suite (task 7.5): the response and stress configurations' injections.
response = []
# The isolation suite (task 7.4): the access matrix and the DMA cases.
isolation = ["rsk/hw-dt"]
stress = []
# The measurement configurations (task 19.2): the loop report (R34.9,
# R35.4) and the EasyDMA traffic scenario (R17.4, R34.5): SPIM0
# transferring continuously for the whole run.
measure = []

[dependencies]
p1-demo-decl = { path = "../decl" }
rsk = { path = "../../../crates/rsk" }

# `cfg(creusot)` is set by the App_Prover's compiler (task 17.1): the glue
# the Generator emits is excluded under it.
[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(creusot)"]

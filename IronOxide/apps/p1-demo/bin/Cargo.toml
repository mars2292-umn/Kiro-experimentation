[package]
name = "p1-demo"
description = "P1 demo binary: no symbols of its own (DD-11); links rsk-entry and the demo system crate; runs on QEMU mps2-an386"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "p1-demo"
path = "src/main.rs"
test = false
bench = false

[features]
# The board (see the system crate): `cargo build -p p1-demo --no-default-features --features nrf52840`.
default = ["qemu-mps2"]
qemu-mps2 = ["rsk-entry/qemu-mps2"]
nrf52840 = ["rsk-entry/nrf52840"]
# HIL builds only: the debug port stays open across resets (see rsk-kernel).
debug-port = ["rsk-entry/debug-port"]
# Debugging only: the Kernel's semihosting trace of every entry point.
trace = ["rsk-entry/trace"]
# HIL builds: the Kernel's entry-point trace in RAM, read by the HIL_Rig.
trace-ram = ["rsk-entry/trace-ram"]
trace-pins = ["rsk-entry/trace-pins"]
# The release-timing configurations of task 7.3 (HIL builds with `nrf52840`).
timing = ["rsk-entry/timing"]
timing-short = ["rsk-entry/timing-short"]
response = ["rsk-entry/response"]
stress = ["rsk-entry/stress"]
stress-short = ["rsk-entry/stress-short"]
isolation = ["rsk-entry/isolation"]
cycles = ["rsk-entry/cycles"]
hw-dt = ["rsk-entry/hw-dt"]
boot-mutation = ["rsk-entry/boot-mutation"]
# HIL builds: the Tasks' debug prints are silent (see the rsk crate).
quiet = ["rsk-entry/quiet"]

[dependencies]
rsk-entry = { path = "../../../crates/rsk-entry" }

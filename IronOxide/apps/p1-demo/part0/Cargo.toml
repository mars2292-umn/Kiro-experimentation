[package]
name = "p1-demo-part0"
description = "P1 demo Partition 0 (level A): the control and sensor Tasks sharing one Resource"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
p1-demo-decl = { path = "../decl" }
rsk = { path = "../../../crates/rsk" }

# Fault-injection builds of the Profile_Conformance_Suite (R3.11, task 14):
# each feature makes one Task violate one restriction at run time so that
# the Kernel's detection and its event log entry (R3.9) can be checked on
# QEMU. Never enabled in a Flight_Build (the features check of PR-36
# applies to the Kernel crates only; these are Application features that
# `cargo xtask conformance` enables one at a time).
[features]
# The release-timing test (task 7.3): every 1024th `sensor` Job runs 50 ms.
timing = []
# Task 21.2: the `telemetry` Endpoint of the QEMU configuration (`control` sends).
telemetry = []
# The fault-injection suite (task 7.5): the response configuration's injections.
response = []
# The isolation suite (task 7.4): the access matrix and the DMA cases.
isolation = ["rsk/hw-dt"]
# The cycle-attribution test (task 7.5, R18.1): a fixed-iteration spin per Job.
cycles = []
# The measurement configurations (task 19.2, R34.9, R35.4): the largest
# iteration count of every bounded loop is kept in per-Task state for the
# safe state's report.
measure = []
fi-pr12 = []
fi-pr19 = []
fi-pr22 = []
fi-pr29 = []

# `cfg(creusot)` is set by the App_Prover's compiler (task 17.1): the glue
# the Generator emits is excluded under it.
[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(creusot)"]

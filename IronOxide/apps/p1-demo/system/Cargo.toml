[package]
name = "rsk-system"
description = "P1 demo system crate: hand-written Generated_Config tables, Partition layout, vector bindings, and the System implementation (what rsk-gen emits from Phase 2 on)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# The board: the QEMU spike's by default, the nRF52840-DK with `nrf52840`
# (`--no-default-features --features nrf52840`): the Kernel's board support,
# the declaration's variant, and Partition 1's timer follow.
default = ["qemu-mps2"]
qemu-mps2 = ["rsk-kernel/board-qemu-mps2", "endpoints", "p1-demo-part0/qemu-inject", "p1-demo-part1/qemu-inject"]
# Tasks 21.2 to 21.5: the configurations that declare the demo's Endpoints (the Partition crates' `telemetry` feature) and report their counters.
endpoints = ["p1-demo-part0/telemetry", "p1-demo-part1/telemetry"]
nrf52840 = ["rsk-kernel/board-nrf52840", "p1-demo-decl/nrf52840", "p1-demo-part1/nrf52840"]
# The release-timing configurations of task 7.3 (with `nrf52840`): the
# declaration variant, Partition 0's late Jobs, and this crate's report.
timing = ["nrf52840", "measure", "p1-demo-decl/nrf52840_timing", "p1-demo-part0/timing"]
timing-short = ["nrf52840", "measure", "p1-demo-decl/nrf52840_timing_short", "p1-demo-part0/timing"]
# The fault-injection configurations of task 7.5 (Verification_Plan 11.4).
response = ["nrf52840", "endpoints", "p1-demo-decl/nrf52840_response", "p1-demo-part0/response", "p1-demo-part1/response", "p1-demo-part2/response"]
stress = ["nrf52840", "measure", "p1-demo-decl/nrf52840_stress", "p1-demo-part1/stress", "p1-demo-part2/stress"]
stress-short = ["nrf52840", "measure", "p1-demo-decl/nrf52840_stress_short", "p1-demo-part1/stress", "p1-demo-part2/stress"]
# The measurement configurations' instrumentation (task 19.2): the loop
# report (R34.9, R35.4) and the EasyDMA traffic scenario (R17.4, R34.5),
# reported by the safe state.
measure = ["p1-demo-part0/measure", "p1-demo-part1/measure", "p1-demo-part2/measure"]
# The isolation configuration of task 7.4 (R16.8, R17.7; Verification_Plan 11.7).
isolation = ["nrf52840", "hw-dt", "p1-demo-decl/nrf52840_isolation", "p1-demo-part0/isolation", "p1-demo-part1/isolation", "p1-demo-part2/isolation"]
# The cycle-attribution configuration of task 7.5 (R18.1; Verification_Plan 11.11).
cycles = ["nrf52840", "p1-demo-decl/nrf52840_cycles", "p1-demo-part0/cycles", "p1-demo-part1/cycles"]
# Its floating-point variant (task 19.3, Δ_fp_save and Δ_fp_restore): `filter` spins too.
cycles-fpu = ["nrf52840", "p1-demo-decl/nrf52840_cycles_fpu", "p1-demo-part0/cycles", "p1-demo-part1/cycles", "p1-demo-part2/cycles"]
# The plain measurement configuration of task 19.4: no injection, the measurement instrumentation alone.
plain-measure = ["nrf52840", "measure", "endpoints", "p1-demo-decl/nrf52840_measure"]
# The Kernel coverage configuration of task 19.5: the plain measurement configuration on the enlarged-Kernel Target.
coverage-kernel = ["nrf52840", "measure", "p1-demo-decl/nrf52840_coverage"]
# HIL builds: the Hardware_Model differential tests (task 3.3).
hw-dt = ["rsk-kernel/hw-dt", "rsk/hw-dt"]
# HIL builds: the boot-check suite's mutation word (task 7.2).
boot-mutation = ["rsk-kernel/boot-mutation"]
defer-probe = ["rsk-kernel/defer-probe"]
defer-nofix = ["rsk-kernel/defer-nofix"]
record-only = ["rsk-kernel/record-only"]
# The coverage build (task 19.2, R34.4): the Kernel zeroes the Partitions'
# coverage counters at instant 0; `cargo xtask hil --coverage` builds it.
coverage = ["rsk-kernel/coverage"]
# HIL builds only: the debug port stays open across resets (see rsk-kernel).
debug-port = ["rsk-kernel/debug-port"]
# Debugging only: the Kernel's semihosting trace of every entry point.
trace = ["rsk-kernel/trace"]
# HIL builds: the Kernel's entry-point trace in RAM, read by the HIL_Rig.
trace-ram = ["rsk-kernel/trace-ram"]
trace-pins = ["rsk-kernel/trace-pins"]
# HIL builds: the Tasks' debug prints are silent (see the rsk crate).
quiet = ["rsk/quiet"]

[dependencies]
p1-demo-decl = { path = "../decl" }
rsk-kernel = { workspace = true, default-features = false }
rsk = { path = "../../../crates/rsk" }
p1-demo-part0 = { path = "../part0" }
p1-demo-part1 = { path = "../part1" }
p1-demo-part2 = { path = "../part2" }

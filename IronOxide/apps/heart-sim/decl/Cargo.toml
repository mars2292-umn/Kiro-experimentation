[package]
name = "heart-sim-decl"
description = "PACEMAKER experiment, Heart_Simulator (docs/pacemaker task 4.2): the App_Declaration of the simulated heart that runs on the rig's stimulus nRF52840-DK"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# The Heart_Simulator has one board, the nRF52840-DK; the feature
# exists so that the bin, rsk-entry, and the system crate forward one
# board feature set as the P1 demo does.
nrf52840 = []

[dependencies]
rsk = { path = "../../../crates/rsk" }

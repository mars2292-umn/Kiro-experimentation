[package]
name = "pacemaker-diag"
description = "PACEMAKER experiment: the Partition diag (level D): the Task history, which keeps the rate histograms, the counts, the trend and the Marker buffer from the event records of the Therapy_Partition"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# The nRF52840-DK: the Partition and its Task. Without it the crate is the
# records' keeping alone (`history`), for host tests: the QEMU declaration
# has no `diag`.
nrf52840 = ["pacemaker-decl/nrf52840"]
# Task 22.4: with `PM_LINK_FAULT=record`, from 10 s into the run every Job
# of `history` sends a record that `comms`'s validation function refuses.
misbehave = ["nrf52840"]

[dependencies]
pacemaker-decl = { path = "../decl" }
pm-core.workspace = true
rsk = { path = "../../../crates/rsk" }

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(creusot)"]

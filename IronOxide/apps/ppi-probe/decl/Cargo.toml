[package]
name = "ppi-probe-decl"
description = "PACEMAKER experiment, PPI probe (docs/pacemaker task 3.6): the App_Declaration of the rig test of fixed PPI channels, for the rig's target nRF52840-DK"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# The PPI probe has one board, the nRF52840-DK; the feature
# exists so that the bin, rsk-entry, and the system crate forward one
# board feature set as the P1 demo does.
nrf52840 = []

[dependencies]
rsk = { path = "../../../crates/rsk" }

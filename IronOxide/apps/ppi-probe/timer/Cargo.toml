[package]
name = "ppi-probe-timer"
description = "PACEMAKER experiment, PPI probe: the Partition that owns TIMER3 and GPIOTE and uses the declared channels"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
nrf52840 = ["ppi-probe-decl/nrf52840"]

[dependencies]
ppi-probe-decl = { path = "../decl" }
rsk = { path = "../../../crates/rsk" }

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(creusot)"]

[package]
name = "ppi-probe-system"
description = "PACEMAKER experiment, PPI probe: the system crate (the Generated_Config tables through the declaration's manifest) and its safe state"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# One board, the nRF52840-DK; the same feature chain as the P1 demo's
# system crate so that rsk-entry forwards one set of board features.
default = ["nrf52840"]
nrf52840 = ["rsk-kernel/board-nrf52840", "ppi-probe-decl/nrf52840", "ppi-probe-timer/nrf52840", "ppi-probe-outsider/nrf52840"]
# HIL builds only: the debug port stays open across resets (see rsk-kernel).
debug-port = ["rsk-kernel/debug-port"]
# Debugging only: the Kernel's semihosting trace of every entry point.
trace = ["rsk-kernel/trace"]
# HIL builds: the Kernel's entry-point trace in RAM, read by the HIL_Rig.
trace-ram = ["rsk-kernel/trace-ram"]
# HIL builds: the Hardware_Model differential tests (task 3.3).
hw-dt = ["rsk-kernel/hw-dt"]
record-only = ["rsk-kernel/record-only"]
trace-pins = ["rsk-kernel/trace-pins"]
# The Tasks' debug prints are silent (see the rsk crate); the PPI probe
# prints nothing anyway.
quiet = ["rsk/quiet"]

[dependencies]
ppi-probe-decl = { path = "../decl" }
rsk-kernel = { workspace = true, default-features = false }
rsk = { path = "../../../crates/rsk" }
ppi-probe-timer = { path = "../timer" }
ppi-probe-outsider = { path = "../outsider" }

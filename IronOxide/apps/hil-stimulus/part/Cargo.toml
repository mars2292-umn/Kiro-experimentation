[package]
name = "hil-stimulus-part"
description = "HIL_Rig stimulus Application: the Partition with the pulse Task"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
nrf52840 = ["hil-stimulus-decl/nrf52840"]

[dependencies]
hil-stimulus-decl = { path = "../decl" }
rsk = { path = "../../../crates/rsk" }

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(creusot)"]

[package]
name = "xtask"
description = "rsk Build_System checks and the verification job (`cargo xtask verify`); host-only, outside the Flight_Build graph"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
rsk-digest.workspace = true
rsk-elf.workspace = true
rsk-hil = { path = "../crates/rsk-hil" }
rsk-gen = { workspace = true, features = ["syntax"] }
rsk-model = { path = "../crates/rsk-model" }
rsk-link = { path = "../crates/rsk-link" }
proc-macro2.workspace = true
serde_json.workspace = true
toml.workspace = true

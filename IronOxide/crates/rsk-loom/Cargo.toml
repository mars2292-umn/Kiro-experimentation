[package]
name = "rsk-loom"
description = "rsk Host_Test_Harness (R47): a host model of Kernel dispatch and locking that runs rsk-logic's Kernel compiled for the host under Loom (exhaustive interleavings) and Shuttle (randomized), with interrupt preemption as threads constrained by the Hardware_Model's rules, checked against the Verus postconditions restated in Rust; testing evidence only (RN-37)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
rsk-logic = { workspace = true }

[dev-dependencies]
loom = { version = "=0.7.2", default-features = false }
shuttle = { version = "=0.9.8", default-features = false }

[package]
name = "rsk-logic"
description = "rsk Kernel proof core: the portable SRP state machine (logic) and the Hardware_Model specifications (hw_model), inside `verus!`; no unsafe code, no hardware access"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# R6.1: every dependency added here enters the Kernel's Target graph, which
# `cargo xtask verify` checks for `std` and `alloc`. The Verus crates are the
# only ones: `vstd` without default features is `no_std` and links no `alloc`.
[dependencies]
vstd.workspace = true
verus_builtin.workspace = true
verus_builtin_macros.workspace = true

# Verified by `cargo verus verify` (R44.6; xtask step "Kernel_Proofs"). This
# crate is a separate Verus crate from rsk-kernel so that the Kernel_Arch
# proofs (rsk-kernel) and the logic proofs share no SMT context: a change on
# one side cannot destabilize the other's queries (seen on 2026-10-22, when
# adding `arch::bound` to the same crate broke two unrelated array-fill
# proofs and tipped `end_top` over the resource limit).
[package.metadata.verus]
verify = true

# The `verus!` macro expands to code gated on these cfgs; stable builds never
# set them (ghost erasure), so the lint must know they are expected.
[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(verus_keep_ghost)", "cfg(verus_verify_core)", "cfg(verus_keep_ghost_body)", "cfg(kani)"]

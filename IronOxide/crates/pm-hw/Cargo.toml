[package]
name = "pm-hw"
description = "PACEMAKER experiment: the hardware layer Hw (docs/pacemaker/design.md PD-10): arming, withdrawing, the pace report and the sense service as sequences over a register interface, so that the same code runs on the nRF52840's registers and on the host's register model; no_std, no rsk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# The App_Prover's contracts (docs/pacemaker task 9.6): never in a
# Flight_Build; `proofs/creusot` builds this source with it.
creusot = ["dep:creusot-std", "pm-core/creusot"]

[dependencies]
creusot-std = { git = "file:///Users/mars2292/repos/Kiro-experimentation/creusot", rev = "18f2d371ecb0019d37ecbd25e67f474bed2dda00", optional = true }
pm-core.workspace = true

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(creusot)"]

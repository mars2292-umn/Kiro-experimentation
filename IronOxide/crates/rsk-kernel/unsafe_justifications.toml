# Justification register of the Kernel_Unsafe_Module (R6.4, PR-20).
# Every `unsafe` block, `unsafe fn`, and `unsafe impl` in
# src/arch/cm4/unsafe_module/ cites one of these identifiers in a comment
# on or above it. `cargo xtask check` verifies that every identifier is
# defined, that a `kani` link names a `#[kani::proof]` function, that a
# `verus` link names a function inside `verus!`, and that a review states
# why no machine check is feasible.
#
# Evidence kinds: "kani" harnesses live in src/arch/cm4/unsafe_module/kani.rs;
# "review" items are exercised by the QEMU dispatch spike (`cargo xtask qemu`)
# and the HIL dispatch tests of task 3.1, and are listed in the
# Trust_Base_Register entries TBR-05 and TBR-06.

schema = 1


[[justification]]
id = "UJ-003"
summary = "KernelCell: Sync for the Kernel static"
kind = "review"
why_no_machine_check = "Soundness rests on the execution model of DD-02 (every access at the Kernel NVIC level or with PRIMASK held, Kernel code non-reentrant) and on Property 12 (Jobs cannot reach Kernel RAM). Neither Kani (sequential, no interrupt model) nor Verus (no notion of the NVIC) can state the absence of concurrent handlers; the HIL preemption-order tests of task 3.1 and the Hardware_Model rule HW-02 are the evidence."
reviewed_by = "rsk kernel review (task 5.1)"
reviewed_on = "2026-10-08"

[[justification]]
id = "UJ-004"
summary = "KernelCell::get: the exclusive reference to the Kernel value"
kind = "review"
why_no_machine_check = "As UJ-003: the reference is created inside one handler and dropped before it returns; handlers of the Kernel level never nest (DD-02)."
reviewed_by = "rsk kernel review (task 5.1)"
reviewed_on = "2026-10-08"


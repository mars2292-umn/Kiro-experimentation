[package]
name = "rsk-kernel"
description = "rsk Kernel_Arch (arch::bound, arch::cm4, Kernel_Unsafe_Module) over the rsk-logic proof core, which it re-exports as logic and hw_model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# R6.1: every dependency added here enters the Kernel's Target graph, which
# `cargo xtask verify` checks for `std` and `alloc`. The Verus crates are the
# only ones: `vstd` without default features is `no_std` and links no `alloc`.
[dependencies]
rsk-logic.workspace = true
vstd.workspace = true
verus_builtin.workspace = true
verus_builtin_macros.workspace = true

# The Target board selects the time-base driver of Kernel_Arch (DD-05):
# the nRF52840 TIMER0 (Phase 1 hardware) or the CMSDK timers of the QEMU
# mps2-an386 board used by the dispatch spike (task 3.1).
[features]
default = ["board-nrf52840"]
board-nrf52840 = []
board-qemu-mps2 = []
# Semihosting trace of every Kernel_Arch entry point (QEMU and HIL debugging
# only; never a Flight_Build feature).
trace = []
# A ring of the same entry-point trace in Kernel RAM (`TRACE_RING`: 256
# entries of tag, value, time-base ticks), read by the HIL_Rig over the
# probe after a run: no halts, no console, a few cycles per entry point.
# HIL builds only; never a Flight_Build feature.
trace-ram = []
# The executing Task's index and the Kernel-active flag on GPIO pins the
# HIL_Rig's analyzer reads (P1.11 to P1.14 of the nRF52840-DK). HIL builds
# only; never a Flight_Build feature.
trace-pins = []
# Keeps the nRF52840's debug access port open across resets by writing
# APPROTECT.DISABLE at boot (recent silicon locks the port at every reset
# unless the firmware does so). HIL builds only; a Flight_Build leaves the
# port protected (R16, ORQ-30).
debug-port = []
# The HIL differential tests of the Hardware_Model (task 3.3, R49.3): two
# boot phases probing the NVIC, BASEPRI, PRIMASK, CONTROL, the exception
# frame, the DWT, and the TIMER compare rule into `DT_RECORD`, and the
# Task-side register probes of the rsk `hw_dt` API. HIL builds only; never
# a Flight_Build feature.
hw-dt = []
# The boot-check suite's mutation word (task 7.2, R12.6): one check of
# Requirement 12 made to fail per run, as the HIL_Rig requests over the
# probe. HIL builds only; never a Flight_Build feature.
boot-mutation = []
# The deferral witness of Verification_Plan 5.8a: the dispatch stub spins
# about 30 µs between its PRIMASK clear and its exception return, so that
# the interleaving of the INVPC finding (an intake inside the window
# pending a higher dispatch vector) occurs many times a run instead of
# about once an hour. HIL builds only; never a Flight_Build feature.
defer-probe = []
# With `defer-probe`: the re-pending of 5.8a removed, so that the window
# faults as the unfixed Kernel did (the mutation the witness run kills).
# HIL builds only; never a Flight_Build feature.
defer-nofix = []
# With `trace-ram`: the records (events, release timing, executions, entries)
# without the trace ring, so that a run measures what the ring costs
# (task 19.2, R34.7). HIL builds only.
record-only = []
# The coverage build (task 19.2, R34.4): the Partition crates compiled with
# `-C instrument-coverage`, their counters in each Partition's RAM
# (`__rsk_cov_table` of the generated linker script), zeroed at instant 0
# and read by the HIL_Rig after the run. HIL builds only; never a
# Flight_Build feature.
coverage = []

# Verified by `cargo verus verify` (R44.6; xtask step "Kernel_Proofs").
[package.metadata.verus]
verify = true

# The `verus!` macro expands to code gated on these cfgs; stable builds never
# set them (ghost erasure), so the lint must know they are expected.
[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(verus_keep_ghost)", "cfg(verus_verify_core)", "cfg(verus_keep_ghost_body)", "cfg(kani)"]

[package]
name = "rsk"
description = "rsk Application API: Context types, Mutex, Signal, now(), Endpoint glue"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
rsk-kernel.workspace = true
# The `rsk::app!` front end (a host proc-macro; PR-36 applies to it).
rsk-macros.workspace = true
# Verus's specification library, for the proofs of this crate's wrappers
# (2026-11-26; `cargo verus verify -p rsk`). As for the Kernel: without
# default features it is `no_std` and links no `alloc`, and every
# specification and proof is erased from a build.
vstd.workspace = true
verus_builtin.workspace = true
verus_builtin_macros.workspace = true
# The App_Prover's specification library (task 17.1): optional, never in a
# Flight_Build; `cargo creusot` builds with `--features creusot`.
creusot-std = { git = "file:///Users/mars2292/repos/Kiro-experimentation/creusot", rev = "18f2d371ecb0019d37ecbd25e67f474bed2dda00", optional = true }

[features]
creusot = ["dep:creusot-std"]
# HIL builds: `debug` prints nothing. A semihosting call halts the core while
# the probe services it, with the time base running, so the demo's per-Job
# prints would cost Budgets and deadlines on a real board (2026-10-29).
quiet = []
# HIL builds: the Hardware_Model differential tests' Task-side probes and
# the isolation suite's access matrix (tasks 3.3 and 7.4).
hw-dt = ["rsk-kernel/hw-dt"]

# `cfg(creusot)` is set by the App_Prover's compiler (task 17.1): the glue
# the Generator emits is excluded under it.
[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(creusot)", "cfg(kani)", "cfg(verus_keep_ghost)", "cfg(verus_verify_core)", "cfg(verus_keep_ghost_body)"]

# Verified by `cargo verus verify -p rsk` (2026-11-26).
[package.metadata.verus]
verify = true

[package]
name = "rsk-elf"
description = "rsk host library: minimal ELF32 little-endian reader (sections, segments, symbols) for the Build_System, the Link_Checker, and the Config_Checker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# The reader over the file's bytes (`reader_v`, 2026-11-26) is verified:
# `cargo verus verify -p rsk-elf` in the verification job. The Verus
# library is the proof tool's; nothing here is linked into a Flight_Build.
[package.metadata.verus]
verify = true

[dependencies]
vstd = { workspace = true, features = ["std"] }
verus_builtin = { workspace = true }
verus_builtin_macros = { workspace = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(verus_keep_ghost)"] }

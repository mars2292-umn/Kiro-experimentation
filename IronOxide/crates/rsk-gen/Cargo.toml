[package]
name = "rsk-gen"
description = "rsk Generator core and CLI: validation, Ceilings, capacities, MPU layout, linker script, Task_Model printer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# The `rsk::app!` source parser (syn); the macro front end and the CLI
# enable it, the core stays dependency-free.
syntax = ["dep:syn", "dep:proc-macro2"]
# The CLI: the parser plus the published schemas, against which it validates
# the Task_Model before writing it (R25.1). Not enabled by the macro front
# end, which writes no Task_Model, so the Flight_Build's host closure stays
# without serde.
cli = ["syntax", "dep:rsk-model"]
# Generators of valid declarations for property-based tests (tests only).
arbitrary = ["dep:proptest"]

[dependencies]
syn = { workspace = true, optional = true }
proc-macro2 = { workspace = true, optional = true }
rsk-model = { path = "../rsk-model", optional = true }
proptest = { workspace = true, optional = true }

[[bin]]
name = "rsk-gen"
path = "src/main.rs"
required-features = ["cli"]

[dev-dependencies]
proptest = { workspace = true }
# The crate's own tests use its `arbitrary` generators.
rsk-gen = { path = ".", features = ["arbitrary"] }

[package]
name = "rsk-protocol"
description = "rsk Protocol_Checker: global Protocol syntax, projection onto roles, well-formedness, and the per-channel buffer bound k (task 21.1)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# A host library of the Generator (R38.3, R38.5, R41.1): the Generator's
# front end hands it the Protocol's text and the Endpoint's roles and
# capacity, and reads back the projections and the bound. Its only
# dependencies are Verus's (task 21.6, R41.3): `progress.rs` lives inside
# `verus!` and is verified by `cargo verus verify -p rsk-protocol` in the
# verification job.
[package.metadata.verus]
verify = true

[dependencies]
vstd = { workspace = true, features = ["std"] }
verus_builtin = { workspace = true }
verus_builtin_macros = { workspace = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(verus_keep_ghost)"] }

[dev-dependencies]
proptest = { workspace = true }

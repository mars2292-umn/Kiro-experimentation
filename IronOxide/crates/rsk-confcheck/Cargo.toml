[package]
name = "rsk-confcheck"
description = "rsk Config_Checker: independent recomputation of derived configuration values against the Task_Model and the linked binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# R26.1: the Config_Checker shares no derivation code, parsing code, or data
# structures with the Generator. Its only dependencies are a JSON parser and
# the ELF reader shared with the Build_System; it never depends on rsk-model,
# rsk-gen, rsk-logic, or rsk-kernel (the Kernel's table encodings it decodes
# are restated here from the Kernel's documentation, which is the point).
# The recomputation core is verified (`derive_v`, Verification_Plan 5.19):
# `cargo verus verify -p rsk-confcheck` in the verification job. The Verus
# library is the proof tool's, not Generator or Kernel code.
[package.metadata.verus]
verify = true

[dependencies]
serde_json.workspace = true
rsk-elf.workspace = true
vstd = { workspace = true, features = ["std"] }
verus_builtin = { workspace = true }
verus_builtin_macros = { workspace = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(verus_keep_ghost)"] }

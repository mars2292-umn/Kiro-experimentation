[package]
name = "rsk-entry"
description = "rsk Kernel entry crate: vector table, reset entry, and HardFault; part of the Kernel_Unsafe_Module"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# R6.1: part of the Kernel. The system crate of the Application is a path
# dependency that the Build_System points at the generated system crate
# (DD-11); in Phase 1 it is the hand-written system crate of the P1 demo.
[features]
# The board, forwarded from the Flight_Build binary to the system crate.
qemu-mps2 = ["rsk-system/qemu-mps2"]
nrf52840 = ["rsk-system/nrf52840"]
# HIL builds only: the debug port stays open across resets (see rsk-kernel).
debug-port = ["rsk-system/debug-port"]
# Debugging only: the Kernel's semihosting trace of every entry point.
trace = ["rsk-system/trace"]
# HIL builds: the Tasks' debug prints are silent (see the rsk crate).
quiet = ["rsk-system/quiet"]

[dependencies]
rsk-kernel.workspace = true
rsk-system = { path = "../../apps/p1-demo/system", default-features = false }

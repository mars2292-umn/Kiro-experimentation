# Justification register of rsk-entry (part of the Kernel_Unsafe_Module,
# R6.4). All entries are reviews: the reset path and the vector bindings are
# link-level constructs that Kani cannot model; the QEMU boot run and the HIL
# boot-check suite (task 7.2) exercise them.

schema = 1

[[justification]]
id = "UJ-101"
summary = "Reset: zero and copy the memory image from the linker tables, then boot"
kind = "review"
why_no_machine_check = "The tables and ranges are defined by the generated linker script of the build; their consistency with the MPU layout is what the Config_Checker verifies (R16.7). The QEMU boot run and the HIL boot-check suite execute the path."
reviewed_by = "rsk kernel review (task 5.1)"
reviewed_on = "2026-10-08"


# Dispositions of UPPAAL cross-check discrepancies (R32.6, R31.5): one entry
# per corpus model whose verifier found a reachable deadline miss while the
# RTA reports PASS. The trace requires confirmation, because stopwatch
# models are verified by over-approximation; the disposition records what
# the confirmation found (a real RTA defect, fixed in ...; a spurious trace
# of the over-approximation; a modelling approximation of the export).
#
# [[discrepancy]]
# model = "m07"
# disposition = "..."
#
# First run with a verifier: 2026-11-14, UPPAAL 5.0.0, model rsk-uppaal/3
# (Verification_Plan 8.7).

[[discrepancy]]
model = "m01"
disposition = "OPEN (2026-11-14): verifyta reports that a miss may be reachable, found in the stopwatch over-approximation, with no trace. Not confirmed and not refuted. Candidate explanations: a spurious state of the over-approximation; pessimism of the export, which delays every Job by up to its own B_i where the Analyzer charges blocking once per busy period (two higher-Priority Tasks of m01 have B of about 320,000 cycles); an optimism of the Analyzer."

[[discrepancy]]
model = "m49"
disposition = "OPEN (2026-11-14): as m01; a possible miss in the stopwatch over-approximation, no trace, neither confirmed nor refuted."

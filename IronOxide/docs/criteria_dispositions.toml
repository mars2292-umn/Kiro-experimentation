# Dispositions of the acceptance criteria that have no Evidence_Item in the
# verification job's store (R50.6), for the Phases whose tasks are done.
# Read by `cargo xtask trace`, which prints them in
# docs/traceability_matrix.md and checks every pointer: a `file` must exist
# and contain `anchor`; an `item` must be an Evidence_Item of the store.
#
# kind:
#   item         an Evidence_Item of the store establishes it, though the
#                item's covers list does not name the criterion
#   proof        a proven statement (Verus), at `file`/`anchor`
#   test         a test, at `file`/`anchor`, that the workspace-test item does
#                not attribute to the criterion
#   measurement  a record of the rig or a section of the plan that reports one
#   document     the criterion asks for a document, which is at `file`/`anchor`
#   inspection   the code is at `file`/`anchor`; nothing executable was found
#   none         nothing was found
#
# A disposition says where the evidence is, not that it is sufficient: the
# note says what it does not cover. Written 2026-11-17 from a reading of the
# sources, the plan and docs/requirements_evidence.toml.


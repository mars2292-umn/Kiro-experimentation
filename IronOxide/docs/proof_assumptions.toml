# 2026-11-18: the register drivers (crates/rsk-kernel/src/arch/cm4/drivers.rs)
# are verified against a register file's specification (`RegState`,
# `write_step`). `Mmio`, the memory-mapped registers as that file, is the
# trusted surface below them: three volatile accesses. `Clock::extend` is
# the Kernel_Arch state's wrap count; since 2026-11-25 the trait method
# says what it returns and what state it leaves by two specification
# functions (`reads`, `then`), which for `Clock` are uninterpreted
# functions of a ghost value: no property of them is assumed, and the
# drivers' statements say only which reading was extended. The rule behind
# it is proven since 2026-11-21 (`ArchState::extend`, plan.rs).

[[assumption]]
file = "crates/rsk-kernel/src/arch/cm4/drivers.rs"
construct = "#[verifier::external_body]"
item = "read"
why = "A volatile word read of a register (hw::mmio_read, UJ-001), which Verus cannot model; the specification says the value is the model's and nothing is changed, so a register whose read has an effect or returns hardware state (an event, a capture) is not described by it."
evidence = "The drivers verified here read configuration registers they then write back (AIRCR, CCR, ACTLR, SHCSR, FPCCR, CPACR, DEMCR, DWT_CTRL) and TIMER0's CC[1] and EVENTS_COMPARE0, whose values no postcondition depends on; Kani harnesses configuration_actions_set_their_bits_and_keep_the_rest and uj_001_mmio_addresses_valid; Lean on the extracted drivers (proofs/aeneas/lean/Hw/Model.lean) over a model with the same read."

[[assumption]]
file = "crates/rsk-kernel/src/arch/cm4/drivers.rs"
construct = "#[verifier::external_body]"
item = "write"
why = "A volatile word write of a register (hw::mmio_write, UJ-002); the specification is `write_step`: the NVIC's set and clear registers are write-one-to-set and write-one-to-clear on the enabled and pending lines (HW-05), TIMER0's INTENSET and INTENCLR likewise on its interrupt enable (nRF52840 PS 6.30), any other register keeps the value. That the silicon behaves so is not provable. Since 2026-11-22 the PPI's channel registers are written under it (`ppi::ppi_write`): CH[n].EEP, CH[n].TEP and FORK[n].TEP keep the value written, and CHENSET, which the specification treats as keeping its value, is in fact a set register of CHEN; the two agree for this one write because `boot_core` has cleared every channel before it."
evidence = "Hardware_Model rules HW-05 and HW-12 with their HIL differential tests; the Kani stub KS-11 implements the same semantics (docs/kani_stubs.toml) and the four step harnesses run the drivers on it; Lean's `RegFile.write` is the same function (Hw/Model.lean). For the PPI's registers: read back on the nRF52840-DK after boot, the end-points as written and CHEN with the bits of exactly the declared channels (docs/pacemaker/rig/task_3_6_ppi_readback.json, 2026-11-22)."

[[assumption]]
file = "crates/rsk-kernel/src/arch/cm4/drivers.rs"
construct = "#[verifier::external_body]"
item = "write_u8"
why = "A volatile byte write into the NVIC's priority array (hw::mmio_write_u8, UJ-009); the specification records the byte at its address. The three implemented bits of a priority byte (ASM-03) are not modelled: the Kernel writes encodings of HW-01 only."
evidence = "Kani harnesses uj_001_mmio_addresses_valid (the address is a byte of NVIC_IPR) and mask_and_priority_actions_step_one_field; HIL differential test HW-01."

[[assumption]]
file = "crates/rsk-kernel/src/arch/cm4/drivers.rs"
construct = "#[verifier::external_body]"
item = "extend"
why = "The extension of the 32-bit counter reading to 64 bits reads and writes the Kernel_Arch state through unsafe_module::extend (UJ-006), which since 2026-11-21 only calls the verified `ArchState::extend` (plan.rs) on that state. The trait method itself still has no specification: the drivers' postconditions hold for whatever instant it returns, and the link from the static state to the verified method is the one-line body."
evidence = "`ArchState::extend`'s contract (Verus): a reading taken less than one counter period after the previous one yields the true instant, across the wrap (`counter_reads`; mutants time-base-wrap-not-counted and time-base-wrap-counted-on-an-equal-reading). Its premise, consecutive readings less than a period apart, rests on the housekeeping slot (`lemma_housekeeping_within_a_period` for the numbers) and on the timer entry running, which the hour-long rig runs exercise across 13 wraps (R9.5). `arm` and `rearm` state their pending decision on the returned instant, whatever it is."


# Proof assumption register (R50.2): every assumption construct in the
# Kernel crates and in every crate that opts into Verus with a
# `[package.metadata.verus]` table (rsk-analyzer, rsk-protocol) (Verus `assume`, `admit`,
# `#[verifier::external_body]`,
# `#[verifier::external_fn_specification]`, `assume_specification`,
# `#[verifier::external]`; Kani `#[kani::stub]`) must have an entry here
# with its justification, or the verification job fails naming the
# construct. The Trust_Base_Register entry TBR-04 covers the assumptions
# inside vstd itself.
#
# Fields: file (relative to the repository root), construct (as the
# verification job prints it), item (the enclosing function, or "" for any),
# why (why the construct is needed), evidence (what reduces the trust: a
# Kani harness, an HIL differential test, or a review record).

schema = 1

# The logic, the Hardware_Model lemmas, the MPU view, the bound Kernel, the
# Analyzer's fixed-point core, and the Protocol_Checker's deadlock-freedom
# certificate (task 21.6) are proved without `assume`, `admit`, or
# `external_body`. The only assumption constructs are the ten trusted
# functions of `Cm4Hw` below (nine until 2026-11-21, when the two trusted
# message copies gave way to three single-word leaves) (tasks 5.7, 5.2 and 21.2, and two since
# 2026-11-13 that were calls of unverified shell code before; "five" here until the
# audit of 2026-11-13, finding 16: `copy_in` and `copy_out` were listed below
# but not counted), the boot-check mutation hook, and the Protocol text's
# `chars_of`. The Kani stubs that replace inline
# assembly are listed in docs/kani_stubs.toml.

# Task 5.7 (2026-10-22): the Kernel_Arch entry points are verified cores
# (crates/rsk-kernel/src/arch/cm4/entry.rs) over the `KernelArch` trait,
# whose Cortex-M4F implementation `Cm4Hw` is the whole register-facing
# surface of the planning code: ten trusted functions. `apply` performs
# one `Action` by calling exactly one register-access function of the
# Kernel_Unsafe_Module (each with its own UJ identifier, Kani harness, or
# review); its specification is the step of the ghost `HwModel`, the
# Kernel's record of what it wrote. The three reads return the hardware's
# values and carry no specification.

[[assumption]]
file = "crates/rsk-kernel/src/arch/cm4/entry.rs"
construct = "#[verifier::external_body]"
item = "apply"
why = "Register writes, NVIC pends and masks, MPU view loads, TIMER compares, the watchdog start and feed (nRF52840 WDT, ORQ-31), and the frame write are volatile accesses and assembly (UJ-001 to UJ-054); Verus cannot model them, so the model's step is the trusted meaning of each action."
evidence = "Each action calls one Kernel_Unsafe_Module function with its own justification identifier: Kani harnesses for the MMIO address table, frame words, BASEPRI and MPU encoders (uj_001_mmio_addresses_valid, rasr_encoding_fields, rbar_encoding_fields, mpu_load_writes_every_region, uj_010_basepri_never_masks_kernel_level); HIL differential tests hil-dt-hw-01, -03, -05, -09, -12 (pending hardware, GAP-09); the QEMU spike (TBR-23)."

# 2026-11-21: `copy_in` and `copy_out` are no longer trusted. Their bodies
# are verified: the copy loop (`Cm4Hw::copy_words`) is proven for every
# length over the two word leaves below, where a bounded Kani check of an
# unverified loop stood before, and the label record is a ghost assignment.
# What stays trusted of the Endpoint message copy is one word read, one
# word write, and the reading of a recorded label.

[[assumption]]
file = "crates/rsk-kernel/src/arch/cm4/entry.rs"
construct = "#[verifier::external_body]"
item = "ram_read"
why = "One volatile read of a word of the SRAM (UJ-056), which Verus cannot model: the model says the word read is the memory model's word at that address. The memory model is one Kernel entry's view (`HwModel::mem`); that no other writer changes the words read during the entry is the Kernel-level execution of the SVC with PRIMASK held (R40.6) and, for a buffer lent to EasyDMA, the lending library's rule that a lent buffer's bytes cannot be named (R17.5)."
evidence = "hw::ram_word is raw::read_ram_word, one read_volatile of an address the cores checked (message_permitted for the Partition's buffer, endpoint_slot for the slot); the Kani harness copy_words_is_total_and_in_bounds runs the proven loop over the simulator's words and its stub asserts the range of every access."

[[assumption]]
file = "crates/rsk-kernel/src/arch/cm4/entry.rs"
construct = "#[verifier::external_body]"
item = "ram_write"
why = "One volatile write of a word of the SRAM (UJ-056a): the model's memory gains that word at that address and nothing else of the model changes."
evidence = "hw::set_ram_word is raw::write_ram_word, one write_volatile of an address the cores checked; the Kani harness copy_words_is_total_and_in_bounds counts the writes (len / 4, or none for arguments the copy refuses) and reads the destination back."

[[assumption]]
file = "crates/rsk-kernel/src/arch/cm4/entry.rs"
construct = "#[verifier::external_body]"
item = "read_label"
why = "ram_read of the first word of an Endpoint slot, with the link to the label record (A-P2, Verification_Plan 5.15): a word the record holds for that address is the word read, because the storage is Kernel-owned and MPU-protected (R16.1) and copy_in is its only writer. This is what the trusted copy_out said before 2026-11-21, now the one trusted step of it."
evidence = "The record is written by copy_in alone, with the word it read back from the slot (proven: its body). The HIL Protocol runs (5.14, 5.15) deliver every label the receivers expect. The role API's half of A-P2: rsk::Endpoint::send_words' and recv_words' Creusot contracts (rsk::channel::sent, received) and every generated send_<label>'s and try_recv's ensures, proven by the App_Prover."

[[assumption]]
file = "crates/rsk-kernel/src/arch/cm4/entry.rs"
construct = "#[verifier::external_body]"
item = "svc_clear_pending"
why = "The drop of a pending SVCall of an ended Job (audit finding 4) is one read and one write of SHCSR, volatile accesses Verus cannot model. The model says the hardware state the cores reason about is unchanged and records that the drop happened. Added 2026-11-13 when the decision moved from the shells into the verified cores (`svc_of_ended_job_core`); until then the call was in unverified shell code."
evidence = "hw::svc_clear_pending under Kani for every register value (svc_clear_pending_clears_only_the_pending_bit: only bit 15 changes, nothing is written when it is clear); the fault-injection suite's late-SVC case (task 7.5)."

[[assumption]]
file = "crates/rsk-kernel/src/arch/cm4/entry.rs"
construct = "#[verifier::external_body]"
item = "stacking_fault_discard"
why = "The discard of the stacking fault of an SVC entry answered as a stack violation (audit finding 9): reads and writes of CFSR and SHCSR. The model says the hardware state the cores reason about is unchanged and records that the discard happened. Added 2026-11-13 with `svc_check_core`; until then the call was in unverified shell code."
evidence = "By inspection of hw::stacking_fault_discard (the MMFSR byte and SHCSR.MEMFAULTPENDED only, under CFSR.MSTKERR); the SVC at the stack's bottom on silicon is on the hardware list (Verification_Plan 5.16)."

[[assumption]]
file = "crates/rsk-kernel/src/arch/cm4/entry.rs"
construct = "#[verifier::external_body]"
item = "now"
why = "The extended 64-bit TIMER counter is a volatile read plus the wrap extension of DD-05."
evidence = "hil-dt-hw-12 (pending hardware); the release-timing run hil-release-timing (task 7.3); QEMU spike timing (TBR-23)."

[[assumption]]
file = "crates/rsk-kernel/src/arch/cm4/entry.rs"
construct = "#[verifier::external_body]"
item = "cycles"
why = "DWT CYCCNT is a volatile read (HW-13)."
evidence = "hil-dt-hw-13 and hil-cycles (pending hardware; QEMU has no cycle counter)."

[[assumption]]
file = "crates/rsk-kernel/src/arch/cm4/entry.rs"
construct = "#[verifier::external_body]"
item = "boot_checks"
why = "The R12.1 checks read CPUID, MPU_TYPE, DWT_CTRL, AIRCR, MVFR0, and the implemented priority bits from the PPB, and on the nRF52840 the CLOCK.HFCLKSTAT and NVMC.ICACHECNF registers (ASM-01 to ASM-05, ASM-06)."
evidence = "Host test `boot_checks_pass_on_the_expected_board_and_fail_one_bit_per_check` (every check passes on simulated expected values and each alone fails with its bit); hil-boot-checks (task 7.2, run 2026-11-04: ten mutated checks each into the safe state with its own bit); QEMU boot (TBR-23; the clock and cache checks are skipped on the QEMU board)."

[[assumption]]
file = "crates/rsk-kernel/src/arch/cm4/entry.rs"
construct = "#[verifier::external_body]"
item = "boot_info"
why = "DHCSR.C_DEBUGEN (ORQ-30) and the nRF52840 POWER.RESETREAS watchdog bit (ORQ-31) are volatile reads; the reset reason is cleared by a volatile write."
evidence = "Host test `boot_info_reports_the_debugger_and_a_watchdog_reset_and_clears_the_reason` (with nRF52840 anomaly 136: DOG beside RESETPIN ignored, task 3.4); hil-boot-checks' watchdog case (task 7.2, 2026-11-04: the reset's next boot fails the watchdog check and reports); no QEMU model."

[[assumption]]
file = "crates/rsk-kernel/src/arch/bound.rs"
construct = "#[verifier::external_body]"
item = "corrupt_config_for_test"
why = "The boot-check suite's table corruption (feature `boot-mutation`, HIL builds only, task 7.2): one value of the `Config` copy in memory changed before the checks, so that the computed checksum differs from the recorded one (R12.3, R12.6). Compiled into no Flight_Build; it establishes nothing for the proofs."
evidence = "hil-boot-checks case 7 (2026-11-04: the corrupted table fails checksum bit 5 alone, no Task released); the Flight_Build's symbol table holds no such function (the feature is off)."

# Task 21.6 (2026-11-08): the verified conversion of the parsed Protocol
# (crates/rsk-protocol/src/theory.rs) makes the parser's two types visible
# to Verus. An external type specification asserts nothing about them: it
# only lets the specifications match on the enum's variants and read its
# public fields, which are what the parser produces.

[[assumption]]
file = "crates/rsk-protocol/src/theory.rs"
construct = "#[verifier::external_type_specification]"
item = ""
why = "ExGlobal: `rsk_protocol::ast::Global`, the parser's global type (an enum with public fields: String, Option<String>, Box<Global>, Vec<Global>), is declared outside `verus!`; the specification `gconv` and the exec `to_theory` match on its variants. The declaration adds no axiom about the type's values."
evidence = "The parser's unit tests and Property 20 (the rendered text round-trips, the projections agree with the global type's traces); `cargo test -p rsk-protocol`."

[[assumption]]
file = "crates/rsk-protocol/src/theory.rs"
construct = "#[verifier::external_type_specification]"
item = ""
why = "ExMessage: `rsk_protocol::ast::Message` (label, payload, from, to: all public Strings), the message of the parser's global type, read by `gconv` and `to_theory`. No axiom about its values."
evidence = "As for ExGlobal."

[[assumption]]
file = "crates/rsk-protocol/src/lex_v.rs"
construct = "#[verifier::external_body]"
item = "chars_of"
why = "The standard library's decoding of the Protocol text (`str::chars().collect()`) into the characters the verified lexer reads (2026-11-09): the contract is the view, `v@ == text@`, which is what vstd's `str` view means. The lexer, the grammar, and the parser from the characters on are verified (`lex_v::sp_lex`, `parse_v::sp_parse`, `lex_v::parse_chars`)."
evidence = "vstd's specification of `str::chars` (the iterator's remaining elements are the view); the parser's unit tests and Property 20 over the whole text path; `cargo test -p rsk-protocol`."

# 2026-11-18: the register drivers (crates/rsk-kernel/src/arch/cm4/drivers.rs)
# are verified against a register file's specification (`RegState`,
# `write_step`). `Mmio`, the memory-mapped registers as that file, is the
# trusted surface below them: three volatile accesses. `Clock::extend` is
# the Kernel_Arch state's wrap count; the trait method carries no
# specification, the rule behind it is proven since 2026-11-21
# (`ArchState::extend`, plan.rs).

[[assumption]]
file = "crates/rsk-kernel/src/arch/cm4/drivers.rs"
construct = "#[verifier::external_body]"
item = "read"
why = "A volatile word read of a register (hw::mmio_read, UJ-001), which Verus cannot model; the specification says the value is the model's and nothing is changed, so a register whose read has an effect or returns hardware state (an event, a capture) is not described by it."
evidence = "The drivers verified here read configuration registers they then write back (AIRCR, CCR, ACTLR, SHCSR, FPCCR, CPACR, DEMCR, DWT_CTRL) and TIMER0's CC[1] and EVENTS_COMPARE0, whose values no postcondition depends on; Kani harnesses configuration_actions_set_their_bits_and_keep_the_rest and uj_001_mmio_addresses_valid; Lean on the extracted drivers (proofs/aeneas/lean/Hw/Model.lean) over a model with the same read."

[[assumption]]
file = "crates/rsk-kernel/src/arch/cm4/drivers.rs"
construct = "#[verifier::external_body]"
item = "write"
why = "A volatile word write of a register (hw::mmio_write, UJ-002); the specification is `write_step`: the NVIC's set and clear registers are write-one-to-set and write-one-to-clear on the enabled and pending lines (HW-05), TIMER0's INTENSET and INTENCLR likewise on its interrupt enable (nRF52840 PS 6.30), any other register keeps the value. That the silicon behaves so is not provable."
evidence = "Hardware_Model rules HW-05 and HW-12 with their HIL differential tests; the Kani stub KS-11 implements the same semantics (docs/kani_stubs.toml) and the four step harnesses run the drivers on it; Lean's `RegFile.write` is the same function (Hw/Model.lean)."

[[assumption]]
file = "crates/rsk-kernel/src/arch/cm4/drivers.rs"
construct = "#[verifier::external_body]"
item = "write_u8"
why = "A volatile byte write into the NVIC's priority array (hw::mmio_write_u8, UJ-009); the specification records the byte at its address. The three implemented bits of a priority byte (ASM-03) are not modelled: the Kernel writes encodings of HW-01 only."
evidence = "Kani harnesses uj_001_mmio_addresses_valid (the address is a byte of NVIC_IPR) and mask_and_priority_actions_step_one_field; HIL differential test HW-01."

[[assumption]]
file = "crates/rsk-kernel/src/arch/cm4/drivers.rs"
construct = "#[verifier::external_body]"
item = "extend"
why = "The extension of the 32-bit counter reading to 64 bits reads and writes the Kernel_Arch state through unsafe_module::extend (UJ-006), which since 2026-11-21 only calls the verified `ArchState::extend` (plan.rs) on that state. The trait method itself still has no specification: the drivers' postconditions hold for whatever instant it returns, and the link from the static state to the verified method is the one-line body."
evidence = "`ArchState::extend`'s contract (Verus): a reading taken less than one counter period after the previous one yields the true instant, across the wrap (`counter_reads`; mutants time-base-wrap-not-counted and time-base-wrap-counted-on-an-equal-reading). Its premise, consecutive readings less than a period apart, rests on the housekeeping slot (`lemma_housekeeping_within_a_period` for the numbers) and on the timer entry running, which the hour-long rig runs exercise across 13 wraps (R9.5). `arm` and `rearm` state their pending decision on the returned instant, whatever it is."

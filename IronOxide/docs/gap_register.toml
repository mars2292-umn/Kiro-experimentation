# Gap_Register v1 source (R54; task 8.2): DO-178C, DO-330, and DO-333
# objectives with their rsk status, the open certification gaps, and the
# certification relevance of every open research question.
#
# Basis: DO-178C DAL A/B with DO-330 and DO-333 (confirmed 2026-10-14). rsk
# is a research prototype that keeps this path open and produces no
# applicant plans (NG-12). `owner` separates rsk deliverables (`prototype`)
# from activities only a certification applicant can perform (`applicant`),
# with `shared` where rsk supplies inputs to an applicant activity (R54.4).
#
# Checked by `cargo xtask check` and step 1 of `cargo xtask verify`
# (xtask/src/checks/registers.rs): every Annex A objective appears once; the
# Level A and B tallies match the published counts; every partial or
# not-addressed item names a gap; the gaps of R54.2 exist; every ORQ of
# design.md appears with the status design.md gives it, so changing an ORQ
# there fails the check until this file changes with it (R54.3); every
# identifier resolves. Status changes of acceptance criteria and ASMs are
# kept in step by review until the traceability matrix exists (task 8.4).
#
# Sources and limits. The project does not hold the texts of DO-178C,
# DO-330, or DO-333. Objective identifiers follow the published Annex A
# structure (tables A-1 to A-10, 71 objectives); titles are rephrased from
# public summaries, not quoted. Published counts: 71 objectives at Level A
# (30 with independence), 69 at B (18), 62 at C (5), 26 at D (2); objective
# A-7.9 applies at Level A only (Wikipedia, "DO-178C", citing RTCA). Level C
# applicability per objective and independence per objective are open items
# (OPEN-01). Content was rephrased for compliance with licensing restrictions.
#
# Fields
#   [[objective]]  id, title, applies (levels among A, B, C; C is the lowest
#                  level of the Profile_Conformance_Suite Application,
#                  R54.1), confirm (levels whose applicability is
#                  unconfirmed), status (addressed | partial | not-addressed |
#                  not-applicable), owner, evidence (Evidence_Item ids or
#                  documents), refs (GAP, ORQ, ASM, TBR, P, R, PR, NG
#                  identifiers), note.
#   [[supplement]] DO-333 and DO-330 items: the objective fields without
#                  `applies`, plus `standard`.
#   [[gap]]        id, title, status (open | mitigated | closed), owner,
#                  links, description, plan.
#   [[orq]]        id, status mirrored from design.md (resolved |
#                  partly-resolved | deferred), certification (whether it
#                  affects certification evidence), gaps, note.

schema = 1
version = "1.0"
updated = "2026-10-14"

[[open]]
id = "OPEN-01"
text = "Confirm per-objective applicability at Level C, and independence per objective at Levels A, B, and C, against DO-178C Annex A. This register marks 63 objectives applicable at Level C against the published 62: five Level C exclusions (A-4.3, A-4.4, A-4.10, A-4.11, A-5.3) are unconfirmed and one exclusion is not identified."

[[open]]
id = "OPEN-02"
text = "Confirm the DO-333 and DO-330 items below against the supplements' texts; they are described, not numbered."


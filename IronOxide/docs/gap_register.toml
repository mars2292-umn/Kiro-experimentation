[[gap]]
id = "GAP-01"
title = "Compiler assurance at DAL A/B beyond Ferrocene's DAL C support"
status = "open"
owner = "shared"
links = ["ORQ-04", "ORQ-08", "ORQ-20", "ASM-09", "TBR-01", "R53.2", "R56"]
description = "Ferrocene supports DO-178C up to DAL C (RN-39). Phases P1 to P4 build with upstream rustc 1.95.0, while the proofs run on rustc 1.98.1. No translation validation exists, and the integrated assembler once emitted a nop for a branch without a diagnostic (ORQ-32)."
plan = "Ferrocene Flight_Builds with a Known Problems assessment (task 23.1); source-to-object traceability and object-code verification of DAL A code (R53.2, Phase P3). Choosing between object-code verification and compiler qualification is the applicant's."

[[gap]]
id = "GAP-02"
title = "Structural coverage tooling for Rust: MC/DC, decision, statement, and data and control coupling"
status = "open"
owner = "prototype"
links = ["ORQ-05", "R53"]
description = "Upstream rustc MC/DC instrumentation was removed in late 2025; GNATcoverage documents Rust MC/DC (RN-40). No coverage tool is selected and no coverage is measured."
plan = "Evaluate and select in task 19.5; measure on the Target at object level if no tool reaches the Kernel's no_std code."

[[gap]]
id = "GAP-03"
title = "DO-330 qualification of Verus, Kani, Creusot, and the other verification tools"
status = "open"
owner = "shared"
links = ["ORQ-06", "ORQ-10", "R51", "TBR-04", "TBR-07", "TBR-08", "TBR-12"]
description = "No DO-330 qualification of Verus, Kani, or Creusot is known. Where their results replace tests they are criterion 2 tools at TQL-4 (verification_plan.md 8.1). Qualification applies per project; rsk tools can at most be qualifiable (R51.6)."
plan = "rsk: tool operational requirements and qualification test suites for the tools it builds, and pinned, recorded versions. Track independent proof checking through the Verus Lean back end (RN-15). Qualification itself is the applicant's."

[[gap]]
id = "GAP-04"
title = "Measurement-based WCET is not a guaranteed bound"
status = "open"
owner = "prototype"
links = ["ORQ-13", "ORQ-12", "ASM-11", "TBR-14", "R34", "R36"]
description = "Schedulability rests on measured execution times with a margin until a static WCET tool is selected in Phase P5; no measurement has been made yet."
plan = "Measurement campaigns with coverage thresholds and loop-bound drive (tasks 19.1 to 19.4); static WCET cross-check (task 24.1)."

[[gap]]
id = "GAP-05"
title = "Robust partitioning evidence under the selected privilege model"
status = "open"
owner = "prototype"
links = ["ORQ-01", "ORQ-28", "R16.10", "R16.8", "R14.11", "P-16", "P-17", "P-18", "TBR-24"]
description = "DD-01 runs every Job unprivileged with hardware-enforced access classes (ORQ-28), so static checks are defence in depth only. Proven over the Hardware_Model: the MPU decision for validated layouts, the never-masked Kernel level, and R14.9 per response. The Kernel_Arch facts these proofs assume hold by inspection (verification_plan.md section 4), the Link_Checker's static checks are not built, and the HIL access matrix is hardware-pending."
plan = "HIL access matrix and fault injection (tasks 7.4, 7.5); Link_Checker scans (task 12.3); bring Kernel_Arch into the proof boundary (GAP-10)."

[[gap]]
id = "GAP-06"
title = "DMA isolation without an IOMMU"
status = "open"
owner = "prototype"
links = ["ORQ-03", "R17", "ASM-07", "TBR-16"]
description = "EasyDMA is a bus master the MPU does not restrict. DD-08 mediates every DMA pointer and length write through the Kernel, but the mediation service is not built (task 5.5) and the DMA isolation cases need hardware."
plan = "Implement and prove the validation of the mediation service (task 5.5); HIL DMA cases (task 7.4)."

[[gap]]
id = "GAP-07"
title = "`core` is certified outside DO-178C"
status = "open"
owner = "shared"
links = ["R57.4", "ORQ-24", "TBR-09", "ASM-17"]
description = "Ferrocene certifies its core subset to IEC 61508 SIL 2 and ISO 26262 ASIL B, not to DO-178C, and the per-item list is customer-only. Two Core_Subset items without that certification are used (`core::arch::asm`, `core::panic::PanicInfo`); four are listed but unused (verification_plan.md 5.9)."
plan = "Confirm the subset against the Safety Manual (ASM-17); remove the unused items in the next Profile version; record substitute evidence for each item used."

[[gap]]
id = "GAP-08"
title = "Verification independence"
status = "open"
owner = "applicant"
links = ["R51.7", "R52.2"]
description = "DO-178C requires independence for 30 objectives at Level A, 18 at B, and 5 at C (published counts). rsk has one author: the specifications, the code, the Kani harnesses that restate the specifications, and the reviews come from the same person."
plan = "Independent review of the Verification_Plan, the specifications against their criteria, the section 5 arguments, and the section 4 inspection facts; tool independence where R26.1 requires it. Staffing independence is the applicant's."

[[gap]]
id = "GAP-09"
title = "Hardware-in-the-loop evidence is pending"
status = "open"
owner = "prototype"
links = ["ORQ-09", "ASM-08", "TBR-02", "TBR-18", "TBR-23", "R49.3", "R48.4", "P-25"]
description = "No nRF52840-DK is available (2026-10-14). Pending: the Hardware_Model differential tests, the validation of Kani stubs KS-01 and KS-02, the boot, release-timing, MPU, DMA, and fault-injection suites, cycle counting, the watchdog, and load control. QEMU results are pre-hardware evidence only (verification_plan.md section 11)."
plan = "Deferred, not dropped: the Phase 1 checkpoint (task 9) requires these items. Before boards: write each test's procedure and predicted outcome, and dry-run the orchestration on QEMU."

[[gap]]
id = "GAP-10"
title = "Kernel_Arch and the unsafe module are outside the proof boundary"
status = "mitigated"
owner = "prototype"
links = ["TBR-05", "TBR-06", "TBR-24", "R44.5", "R45.1", "P-13"]
description = "The logic proofs assume facts about Kernel_Arch (verification_plan.md section 4, A1 to A11). Since 2026-10-22 the bound Kernel (`arch::bound`) is inside `verus!`: A9 is proven, the computations of A1, A3, A4, and A6 are proven; the register writes and the call order in `arch::cm4` still hold by inspection only. 38 of 43 unsafe constructs are justified by review; the Kani harnesses build for the host, so the flight-only volatile and assembly paths are compiled out."
plan = "Done 2026-10-22 (task 5.7): `Bound`, `KernelOps`, the planning computations, and every entry point are in `verus!` (arch/bound.rs, arch/cm4/plan.rs, arch/cm4/entry.rs); the hardware is driven through `KernelArch::apply` specified as a step of the ghost `HwModel`, with four trusted functions listed in docs/proof_assumptions.toml. Remaining: restructure the unsafe module so that Kani harnesses reach the flight code; HIL tests on the Target; a Hardware_Model lemma that takes the `HwModel` the cores write as its premise."

[[gap]]
id = "GAP-11"
title = "Ghost erasure: the flight source is not shown equal to the verified source"
status = "open"
owner = "prototype"
links = ["ORQ-08", "ORQ-20", "R52.3", "R55.3", "TBR-01"]
description = "The `verus!` macro (verus_builtin_macros) produces the source that becomes airborne code, which makes it a criterion 1 tool unless the erased source is compared with the verified code. The comparison is not done."
plan = "Archive and compare the ghost-erased Kernel source (task 23.1); the Kani cross-checks on erased code are a bounded partial mitigation."

[[gap]]
id = "GAP-12"
title = "Panic freedom outside the verified logic"
status = "open"
owner = "prototype"
links = ["ORQ-07", "PR-19", "R44.7", "R14.4"]
description = "Kernel_Arch and rsk-entry are safe Rust outside `verus!` and are not proven panic-free. A panic there reaches the safe state, so it is a detected Kernel fault, not undefined behaviour (verification_plan.md 5.6)."
plan = "Link_Checker no-panic-path check from Kernel entry points (task 12.3), or move the code into `verus!` (GAP-10)."

[[gap]]
id = "GAP-13"
title = "The Phase 2 checkers are not all built"
status = "mitigated"
owner = "prototype"
links = ["R50.1", "R26", "R37", "R3.5", "R51.3", "TBR-11", "TBR-12"]
description = "The verification job runs Verus, Kani, the tests, the QEMU spike and, since 2026-10-23, the Config_Checker with its mutation suite (task 13) the whole Link_Checker (tasks 12.1 to 12.3: stack bounds, instruction-class and symbol scans, Core_Subset mapping, the ORQ-32 stub rule, and the no-panic-path report), and the Profile_Lint (task 11.1: `rsk-lint` and the Clippy deny-lists); the Profile_Conformance_Suite is absent (R50.1), so the P1 demo stands in for it. The argument that the Generator needs no qualification now rests on a built Config_Checker (verification_plan.md 8.2)."
plan = "Done 2026-10-23 (task 14.1): the Profile_Conformance_Suite (docs/conformance_suite.toml, verify step 10c) runs on every job. Open: the accepted Application of R3.7 is the P1 demo, which lacks a level-B Partition, an FPU-using Task, an EasyDMA peripheral, a cross-Partition Endpoint (Phase 4), and the Init_Arena; the Jorvik variant is not implemented; 29 of 66 cases are declared with a reason (TS rules enforced by API absence, deny-listed crates that are not vendored, loop detection in object code)."

[[gap]]
id = "GAP-14"
title = "Properties over sequences of transitions are argued, not mechanized"
status = "open"
owner = "prototype"
links = ["R8.2", "R8.4", "R8.5", "R8.9", "R10.1", "R10.2"]
description = "Bounded blocking, ceiling restore across preemptions, deadlock freedom, the lazy release of killed Jobs, and MIT spacing over a run are pen-and-paper arguments over proven per-transition facts (verification_plan.md section 5). They are review evidence and earn no DO-333 credit."
plan = "A ghost history or trace model in Verus; property-based tests against the SRP simulator (task 15.4)."

[[gap]]
id = "GAP-15"
title = "Activities only a certification applicant can perform"
status = "open"
owner = "applicant"
links = ["NG-12", "R54.4"]
description = "Plans (PSAC, SDP, SVP, SCMP, SQAP) and their coordination, approval of standards, system requirements and the system safety assessment, problem reporting and change control, software quality assurance and the conformity review, and certification liaison."
plan = "Out of scope for the prototype (NG-12). rsk keeps the inputs these need: requirements, design, Verification_Plan, registers, and Evidence_Items."

[[gap]]
id = "GAP-16"
title = "Proof re-runs from archived inputs are not automated"
status = "open"
owner = "prototype"
links = ["R50.4", "R59.3", "TBR-19"]
description = "Evidence_Items record the source revision and the tool versions, but a run may come from a dirty tree, and no command re-runs an archived proof Evidence_Item and compares its verdict (R50.4). The rebuild comparison (R59.3) covers binaries only."
plan = "Refuse proof Evidence_Items from a dirty tree or archive the diff; add a re-run command that compares verdicts."

[[gap]]
id = "GAP-17"
title = "Kernel code executes VFP data-movement instructions, which R6.6 as first written did not allow"
status = "closed"
owner = "prototype"
links = ["ORQ-16", "PR-31", "R6.6"]
description = "LLVM emits `vldr`, `vstr`, and `vmov` for 64-bit data moves in Kernel code, so the coprocessor stays enabled. The moves do not alter a Job's floating-point context (verification_plan.md 5.7). Closed 2026-10-22: R6.6 and PR-31 (Profile 0.4) amended to allow floating-point data-movement instructions in Kernel code while forbidding arithmetic, comparison, conversion, and FPSCR writes."
plan = "Closed by the amendment; the Link_Checker instruction scan (task 12.3) enforces the amended rule and the HIL register-pattern test confirms context preservation."

[[gap]]
id = "GAP-18"
title = "Standards and reviews of requirements, design, and specifications"
status = "open"
owner = "shared"
links = ["R52.2", "R43.5"]
description = "No requirements, design, or coding standards exist beyond the Profile and the Build_System checks. Neither the requirements nor the Verus specifications have been reviewed against each other, and traceability is by citation without a matrix."
plan = "Write requirements and design standards; review each specification against its criterion (verification_plan.md 9.2); traceability matrix (task 8.4). Independent review is GAP-08."

[[gap]]
id = "GAP-19"
title = "UPPAAL licence and model fidelity"
status = "mitigated"
owner = "prototype"
links = ["ASM-13", "ORQ-22", "TBR-17"]
description = "UPPAAL is used under its academic licence and only as a cross-check; no credit is claimed. The exported model does not yet model the SRP ceiling."
plan = "Model the ceiling in the exporter (task 16.1); a commercial licence is needed for certification use (ASM-13)."


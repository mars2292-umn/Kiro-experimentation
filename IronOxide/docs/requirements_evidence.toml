# ---------------------------------------------------------------- R8

[[row]]
requirement = 8
sentence = "A Job enters a shared Resource by raising the system ceiling to the Resource's ceiling and leaves by restoring it; no two Jobs are ever inside the same Resource, a Job never waits at a lock, a Job is blocked at most once per Release for at most one critical section, and no deadlock is possible."
implemented = "`Sched::lock` and `unlock` keep a stack of held Resources and the ceiling (crates/rsk-logic/src/logic/sched.rs), reached through two supervisor calls; the Generator computes each Resource's ceiling from the declaration, and the `rsk::Shared::lock` API gives the data only inside a closure (crates/rsk/src/lib.rs)."
strength = "yes"
strength_note = "For R8.1 to R8.5, which are the properties the requirement asks to be proven, the statements say what the requirement says, about the Kernel's scheduler state. A lock by the Job on top finds any existing holder entry of that Resource to be the Job's own (so it never waits); a pending Job that is not eligible is blocked by exactly the kind of holder R8.4 describes (a lower-Priority Job holding a Resource whose ceiling reaches it); a blocker itself waits for nothing, so there is no cycle; and between a lock and its matching unlock the stack of held Resources and the ceiling return to what they were. R8.6, R8.7 and R8.10 are the type system's and the Generator's, shown by compile-fail cases. What the statements do not carry is time: R8.8's bounds are measured, and the length of the one blocking interval is the Analyzer's term."
closed = "2026-10-22 and 23: restore across preemptions, single blocking and deadlock freedom moved from written arguments to lemmas over the history."
gaps = "The realisation of the ceiling in BASEPRI is the entry code's (see R7). Δ_lock_in and Δ_lock_out are measured. R8.9 (Resources released when a Job is ended by the Health_Monitor) is part of the response's contract (see R14), not cited here."


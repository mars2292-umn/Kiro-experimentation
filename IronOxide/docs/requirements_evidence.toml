# ---------------------------------------------------------------- R39

[[row]]
requirement = 39
sentence = "Message passing between Tasks uses fixed, statically allocated buffers with no heap and no async runtime, each operation has a bounded execution time, and a buffer behaves as a first-in, first-out queue of its declared capacity."
implemented = "Each Endpoint channel is a ring of fixed-size slots in Kernel-owned storage; the index arithmetic is `endpoint::Fifo` (crates/rsk-logic/src/logic/endpoint.rs) and the copies in and out are word copies by the Kernel (crates/rsk-kernel/src/arch/cm4/entry.rs)."
strength = "weaker"
strength_note = "The queue of slot indices is proven to be a first-in, first-out sequence: a push appends the next slot unless the queue is full, a pop removes the oldest unless it is empty, and a refused operation changes nothing. R39.4 asks this of messages. The step from slots to message contents is the Kernel's copy, which is checked by Kani to stay in bounds and round-trip its words, and the model records only each message's first word. So 'no message lost, duplicated or reordered' is proven for the positions and checked, not proven, for the bytes."
closed = ""
gaps = "The copy of message bytes is bounded-checked and tested, not proven equal end to end. R39.3's execution-time bounds are measured. R39.1 (no heap, no executor) is the Link_Checker's and the lint's."

[[row.statement]]
file = "crates/rsk-logic/src/logic/endpoint.rs"
name = "push"
tool = "verus"
says = "On a well-formed queue of the given capacity: if it returns a slot, the queue was not full, the slot is the next position after the last, and the queue's sequence is the old one with that slot appended; if it returns nothing, the queue was full and is unchanged."
reviewed = "f77fb1eb7796c15e"

[[row.statement]]

[[row]]
requirement = 60
sentence = "Architecture-specific code is isolated so that other processors can reuse the portable logic and its proofs."
implemented = "The Kernel's logic (crates/rsk-logic: scheduling, time, budgets, the health monitor, the layout rules) touches no hardware and is proven on its own. Everything that touches the processor is under crates/rsk-kernel/src/arch/cm4: the decisions of each Kernel entry are written against a trait (`KernelArch`) whose one way to change hardware is to perform a named action, and the code that performs the actions on real registers is confined to that directory's unsafe module. A QEMU board and the nRF52840 share all of it."
strength = "weaker"
strength_note = "R60.1 and R60.2 hold for the one architecture there is. The interface's contract says a performed action changes a model of the hardware exactly as the model's step function says and changes nothing else, and every entry decision is proven for any implementor of that interface, so the proofs do not depend on the register-level code. Weaker in two ways. The interface's vocabulary is this processor's (a priority mask, MPU region registers, the floating-point stacking mode), and the entry decisions proven against it live in the architecture directory, so a different architecture would reuse rsk-logic and its proofs unchanged but would need its own actions, model and entry proofs; that is more than 'new proofs only for its Kernel_Arch implementation and its Hardware_Model' if Kernel_Arch is read narrowly. And R60.3 to R60.5 apply only when a target is added: none has been, so the claim that a port is cheap is untested."
closed = ""
gaps = "No second architecture exists, so reuse is argued from structure and not shown. Whether the register-level code does what the model's step says is tests on the board and inspection, not proof. The ports (Cortex-M33, RISC-V) are Phase P5 and open."


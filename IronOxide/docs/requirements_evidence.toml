strength = "weaker"
strength_note = "Three statements now bear on R11.1, R11.2 and R11.7, all on models. The stub theorem says a handler interrupted by a Kernel interrupt resumes with S16 to S31, every core register and its stack as it left them, on a model of the stub's instructions. Boot's contract includes the eager-stacking flag of the hardware model. The dispatch contract says the dispatched Job has floating-point access exactly when its Task is declared FPU-using, so a Task that is not cannot change another Job's registers. Weaker than the requirement because: S0 to S15 and the status register are saved by the processor, which the model assumes (HW-10) and does not prove; the stub model is of the instruction sequence, compared with the assembly line by line by a build check, while what each instruction does is the model's own definition; the access statement is proven for a dispatch but not for the return to a preempted Job, where the same table is read; R11.8's settings for a new Job, R11.3's costs and R11.4's stack space are tested, measured and computed, not stated formally; R11.7 as written says the FPU is enabled during Init, while the Kernel enables it per Job, which is stricter."
closed = "2026-11-17: the dispatch contract states the floating-point access rule (before, no statement mentioned it). 2026-11-16: the rig's check of the status register a new floating-point context starts with compared against a record that read zero whether or not the probe had run; the record now carries a written flag."
gaps = "The processor's own stacking is an assumption about hardware, supported by the board's register-pattern probe across preemptions. Floating-point access after a return to a preempted Job is by inspection and that probe. Δ_fp_save and Δ_fp_restore are measured at the method's resolution. One erratum's workaround (flush-to-zero) is a declaration option."


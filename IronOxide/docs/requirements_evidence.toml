# ---------------------------------------------------------------- R17

[[row]]
requirement = 17
sentence = "A peripheral that moves data by itself (EasyDMA), bypassing memory protection, may only read and write its own Partition's ordinary memory; a request for any other buffer is refused before a byte moves, and a Partition's transfers are stopped before its memory is re-initialized."
implemented = "A Partition cannot write its DMA peripheral's pointer and count registers: its view maps that peripheral read-only. It asks the Kernel, which checks that the buffer lies in the Partition's RAM above the stack and then writes the registers itself (`dma_request_core` in crates/rsk-kernel/src/arch/cm4/entry.rs; the buffer test is `Layout::dma_permitted` in crates/rsk-logic/src/logic/mpu.rs). Since 2026-11-16 a Task can only make that request through a buffer type that hides its bytes while a transfer has them (`rsk::DmaBuf`, `DmaTransfer`, `DmaHeld` in crates/rsk/src/lib.rs): lending returns a value that stands for the transfer, the bytes come back only when that value is given back and the peripheral has reported the stop, and dropping the value stops the transfer. Only the SPIM class is supported; the Generator rejects the others."
strength = "weaker"
strength_note = "Close on every criterion the Kernel is responsible for, with what remains stated. R17.1 and R17.2: the request function is proven to accept a request exactly when the channel belongs to the executing Job's Partition and the buffer passes the test; an accepted request programs that channel's two registers with that buffer and nothing else, a refused one programs nothing; the register write behind it is checked to write those two registers only; and every byte of a permitted buffer is proven to lie in the Partition's own RAM above its stack, given the hardware rule HW-15. R17.3: the register-write service is proven never to write a pointer, count or list-mode register and never to program a transfer. R17.5: the lending library is model-checked for every sequence of four operations, with arbitrary register values, to hand out a buffer's bytes only when no transfer of it is outstanding. Still weaker than the requirement's words in two places. HW-15 is an assumption about the peripheral, cited to the vendor's specification and checked on the board by guard bytes at three transfer rates, not proven. And the model check of the library is bounded (four operations, a two-read wait, the host doubles of the supervisor calls) and is about the library's own bookkeeping: that the peripheral has truly stopped when it reports STOPPED is again the vendor's."
closed = "2026-11-06: a peripheral shortcut restarted a transfer after the Kernel had stopped it at a restart (one in ninety on the board); the stop now clears the shortcut first. 2026-11-13 (audit findings 1 and 10): the claim is limited to the SPIM class, and the read-only window is proven and checked at boot. 2026-11-16: the contract of `dma_request_core` did not state the refusal rule (found when this row was first written from the contract's text); it is now a postcondition, with three mutants killed. 2026-11-16: nothing addressed R17.5 (the request borrowed the buffer only for the call and the transfer ran on after it); the request now goes through a buffer that is out of reach while lent. 2026-11-16: `dma_write_core` gained its postcondition (two mutants killed); the peripheral's address is no longer the Task's argument (the Generator emits each Partition's channels as constants)."
gaps = "HW-15 and the meaning of the STOPPED event rest on the vendor's documentation and the footprint test on one peripheral (SPIM0). The library's check is bounded model checking, not an unbounded proof. A transfer that is dropped leaves its buffer out of reach until the Partition restarts. Other peripheral classes are out of scope in this version. The hour-long configurations were not run on this build."


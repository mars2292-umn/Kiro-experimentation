# ---------------------------------------------------------------- R40

[[row]]
requirement = 40
sentence = "Endpoint buffers are Kernel-owned Resources under the ceiling protocol, a message can release a sporadic Task subject to its MIT, send and receive never wait, and a full buffer is an error reported to the Health_Monitor."
implemented = "Send and receive are supervisor calls served at the Kernel's level, so each is one indivisible step for every Task (`endpoint_send_core`, `endpoint_recv_core` in crates/rsk-kernel/src/arch/cm4/entry.rs); a send to a receive role bound as a Release_Source goes through the same intake as an interrupt (see R10); the Analyzer counts each operation in the Task's execution and blocking terms."
strength = "weaker"
strength_note = "The entry contracts say less than the requirement. A send that is accepted appends the message's first word to the channel's sequence of labels, and a receive that succeeds takes the oldest label and delivers that word first; a receive that is not refused leaves the Kernel's state exactly as it was; neither moves the executing Job's time account. Together with the queue's contracts (R39) this gives 'never waits' and 'a refused operation changes the queue not at all'. Not stated by any contract read here: that a full buffer is reported to the Health_Monitor and charged to the sender (R40.5), that a message stays in the buffer when the Release it would cause is discarded (R40.3), or what happens to an operation cut short by a Health_Monitor action (R40.6). Those are in the functions' bodies and the board's Endpoint cases."
closed = "2026-11-09: the label a receiver sees was tied to the label the sender wrote (the channel's label sequence in the hardware model). 2026-11-16: Endpoint injections on the board (a rejected reply, a dropped role state)."
gaps = "R40.3, R40.5 and R40.6 as postconditions of the send and receive cores. Only a message's first word is modelled; the rest of the payload is the copy's (bounded-checked). R40.2 is the Analyzer's, with tests."


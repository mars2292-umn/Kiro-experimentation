# ---------------------------------------------------------------- R41

[[row]]
requirement = 41
sentence = "Tasks that exchange messages over Endpoints following a declared Protocol can never all be waiting on each other, buffers are large enough for the Protocol, and a session abandoned half-way is detected."
implemented = "The Protocol_Checker explores each Protocol's reachable configurations and accepts it only with a certificate of progress and of a bound on messages in transit (crates/rsk-protocol/src/progress.rs for two parties, multiparty.rs for more). The Generator sizes and rejects buffers from that bound, and the role types in crates/rsk make a wrong or abandoned step a compile error or a reported violation."
strength = "weaker"
strength_note = "R41.3 asks for a proof about every Application that satisfies the Profile. What is proven is about a Protocol: if the checker accepts it, no reachable configuration of its roles and channels is a deadlock, and (two parties) no channel exceeds its capacity. That is proven of the specification in Verus and again of the checker as compiled in Lean. The step from 'the Protocol's model cannot deadlock' to 'the Application's Tasks cannot' goes through assumptions the plan lists (each role is played by one Task that follows its role type; a Task waiting on a message holds no Resource; gating across Endpoints is as declared), some enforced by the Generator or the Kernel and some by test. R41.3 also asks that those assumptions be listed, and they are."
closed = "2026-11-08: the first certificate was per Endpoint; the argument across Endpoints was added under declared gating. 2026-11-09 and 2026-11-15: the multiparty theorem, then the same theorem on the compiled checker."
gaps = "The assumptions that remain with reasons and not proofs (A-P1, the message half of A-P2, A-P4, the body half of A-P8, A-P9, A-P10), and A-P6 for a Partition's stop or restart, which is an assumption with test evidence. R41.2 is partly at compile time and partly a run-time report. R41.4 (end-to-end latency) is the Analyzer's, with tests and no proof cited here."


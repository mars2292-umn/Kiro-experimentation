# ---------------------------------------------------------------- R14

[[row]]
requirement = 14
sentence = "Every fault, panic and violation goes to the Health_Monitor, which applies the response the Partition declared (end the Job, restart or stop the Partition) or, for a fault of the Kernel itself, puts the system in its safe state; other Partitions are left as they were."
implemented = "`Kernel::fault` picks the response from the executing Job's Partition and `Kernel::apply_response` carries it out: ending the Job on top, or ending every Job and Release of the Partition and marking it for re-initialization or as stopped (crates/rsk-logic/src/logic/kernel.rs). The fault handlers that decide whether a fault was the Kernel's or a Job's are the assembly stubs and their Rust halves in crates/rsk-kernel/src/arch/cm4/."
strength = "weaker"
strength_note = "The statements say what each response does to the Kernel's state and that other Partitions' Tasks, stack entries, held Resources and flags are unchanged, which is R14.4, the state part of R14.5 and R14.9. They say less than the requirement in four places. Whether a fault is the Kernel's is an input (`kernel`), so R14.3's attribution of each hardware fault class is outside them. R14.9's exception for Endpoints (the peer sees the state change) is not in `others_unchanged`. No statement bounds the time a response takes (R14.8, R14.10): those are measured. The statements describe the model's state, not the registers; re-initializing memory and stopping DMA are flags here that the entry code acts on. One thing is stricter than a reader might expect: 'end the Job' on a Job that holds a Resource is carried out as a restart of the Partition."
closed = "2026-11-02: the response suite on the board found four defects (a restart that did not re-initialize, a stale supervisor call served after its Job ended, an Overrun reported more than once, a deadline event served after other events); each was fixed and is covered by the suite."
gaps = "Fault attribution (R14.3) is by inspection of the stubs, since 2026-11-13 backed by a machine model of the stubs' instruction sequence, and by the rig's injected faults. Response times are measured figures with a margin, not static bounds. R14.1 (abort, one panic handler) is the Link_Checker's check and R14.6 to R14.7 (the event log) have a proof that is not cited in this row. A Partition's stop or restart seen from an Endpoint peer is an assumption with test evidence (A-P6)."


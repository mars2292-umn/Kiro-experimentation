# ---------------------------------------------------------------- R37

[[row]]
requirement = 37
sentence = "The worst-case stack use of every Task and every Kernel entry is computed from the linked binary, combined per stack region according to who can preempt whom, and the build fails if any function's use cannot be bounded."
implemented = "The Link_Checker (`rsk-link`) reads the binary's instructions, sums each function's stack-pointer decrements, follows the call graph, rejects recursion and unresolved indirect calls, and adds exception and floating-point frames per preemption level. Its bounds are exported to the Config_Checker."
strength = "weaker"
strength_note = "No formal statement of the analysis itself: it is a static analysis tool, not a proof, and its soundness rests on its frame model (the sum of stack-pointer decrements is an upper bound for compiler-generated code; a dynamic stack pointer fails the build). Two things stand behind it. If a bound were wrong, the memory protection still refuses a write below the stack (proven, see R16). And since 2026-11-16 the bounds are compared with measured high-water marks on the board in five configurations, all within their bounds."
closed = "2026-11-16: stack painting on the board (the stress, timing, measurement, response and isolation configurations)."
gaps = "The tool is not qualified or cross-checked against a second tool (a differential run was not possible offline). Measured high-water marks are lower bounds on real use, so they can refute a bound but not confirm it."


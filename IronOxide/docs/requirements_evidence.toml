implemented = "crates/rsk-gen/src/emit.rs writes the tables. Since 2026-11-16 the emitted table is read back and compared with the derived values before it is handed out (crates/rsk-gen/src/readback.rs), and the generated code asserts, at compile time, that the tables pass the Kernel's own validation. A drift check compares the committed generated files with a fresh generation; the Kernel verifies the checksums at boot."
strength = "weaker"
strength_note = "Four mechanical checks now stand around the unproven printer. The printed table is read back by a separate reader and compared with the derivation. The generated crate will not compile unless `Config::validate` and `Layout::validate`, the Kernel's own validators, accept the tables: `Config::validate` is proven to be true exactly for a well-formed configuration, which is the premise of every Kernel proof, so a build that succeeds has tables the proofs apply to. The Config_Checker compares the tables in the linked binary with the model. And the Kernel repeats the validation and checks the checksums at boot. This is validation of each build's output, not a proof about the Generator for all declarations; for the property the requirement is after (what runs and what was analysed cannot differ) it is the stronger of the two kinds, because it checks the actual output."
closed = "2026-11-16: well-formedness of the generated tables was established only at boot, on the board; it is now a condition of compiling. The read-back was added the same day. 2026-11-17: the read-back extended to the layout table, so a printed layout that is well-formed but not the derived one fails the generation."
gaps = "The read-back covers the numbers of the configuration table and, since 2026-11-17, the layout table (every interval, subregion mask, stack size, window and read-only flag); it does not cover the DMA and Endpoint tables or the access matrix (the Config_Checker covers those from the binary). The checksum is CRC-32."


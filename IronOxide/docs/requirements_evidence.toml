# ---------------------------------------------------------------- R9

[[row]]
requirement = 9
sentence = "Each periodic Task is released at its offset plus a whole number of periods, computed from the offset and period alone so that it never drifts; a Release that falls due while the previous one is still pending is discarded and counted; a Job not finished by its deadline is reported; and at the end of the declared operating duration the system enters its safe state."
implemented = "The Kernel keeps one timer slot per timed event and a nominal instant per periodic Task; the timer entry serves every slot that is due (`Kernel::timer_event`, `periodic_release`, `deadline_miss` in crates/rsk-logic/src/logic/kernel.rs; the instants in logic/time.rs). One hardware timer compare is armed for the earliest slot (crates/rsk-kernel/src/arch/cm4/entry.rs)."
strength = "weaker"
strength_note = "R9.3 is proven as stated: the next nominal instant is the offset plus (k+1) periods, whatever else happened, or there is none within the operating duration. R9.1's 'released at the nominal instant' is proven in the sense that every periodic Task whose nominal instant is at or before the reading the timer entry is given has its Release served in that entry. Weaker: 'no later than J_rel after the instant' (R9.2) and 'within Δ_detect' (R9.6) are about real time between the instant and the entry, which is measured on the board, not proven; and the reading itself comes from hardware the proof models only as a number."
closed = "2026-11-02: one unanswered stimulus pulse in the first hour-long run (still open against the fault-injection task). 2026-11-05: the link from armed slots to the Releases the entry makes was a comment; it is now a postcondition of `timer_event`. 2026-11-16: on the code as extracted, a periodic Task's nominal instant is shown to move by exactly its period (Sched/Time.lean), and the run Property 18 is proven over takes periodic arrivals at those instants with their spacing derived (Sched/Arrive.lean). 2026-11-17 (R9.6): a Job of a sporadic Task that ended before its deadline was logged as a Deadline miss, and the Partition's deadline response applied, when a deferred Release of the Task was held at the Job's end (the Job-end code kept the deadline event whenever a Release was held, and a deferred one has not armed its own); the Job-end code now disarms it unless the held Release is pending, with the postcondition changed to say so and a test (crates/rsk-loom/tests/deadline_after_deferral.rs)."
gaps = "J_rel and Δ_detect are measured over an hour with a margin. The hardware timer's compare rule has a near-counter exception found by test (HW-12, ASM-19). R9.10 is the rig's hour-long run, on one Application."


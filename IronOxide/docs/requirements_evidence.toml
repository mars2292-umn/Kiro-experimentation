# ---------------------------------------------------------------- R16

[[row]]
requirement = 16
sentence = "No Partition can write another Partition's or the Kernel's memory, touch a peripheral it does not own, or run code that is not its own or shared; a stack overflow is caught before it damages anything outside the stack."
implemented = "Each Partition runs unprivileged under a memory-protection (MPU) view computed from the generated layout: its own code, its own RAM, its own peripheral windows and the shared code, nothing else (crates/rsk-logic/src/logic/mpu.rs). The Kernel loads the view at every dispatch (crates/rsk-kernel/src/arch/cm4/entry.rs). The model of what the MPU grants is crates/rsk-logic/src/hw_model.rs."
strength = "weaker"
strength_note = "For R16.6, which asks for exactly this proof, yes: for every well-formed layout and the view computed for a Partition, the model of the MPU grants unprivileged access only to the Partition's own regions, and nothing of the Kernel or of another Partition. For R16.1 to R16.5 as statements about the board, weaker: the proof is about a model of the MPU's decision, and that the processor decides as the model does, and that the Kernel has loaded the right view whenever a Partition runs, are outside these statements. On the stack (R16.5): a write outside the Partition's own RAM and windows is refused, which covers an overflow off the bottom of the stack, but not one that jumps far enough to land in the Partition's own peripheral window; the Link_Checker's stack bounds are what excludes that."
closed = "2026-11-05: the Kernel's own peripherals and the processor's private peripheral bus were not intervals of the layout, so the proof did not cover them; they are now (`lemma_view_no_kernel_window`). 2026-11-13 (audit findings 8 and 9): a stack pointer that a Job moved outside its stack region is now checked by the Kernel at entry."
gaps = "That the hardware behaves as the model says is by citation of the architecture manual and differential tests on the board (ASM-02, the HW rules). The register encoding of a region is checked at field level only (Kani). The Kernel's own stack check at entry is not cited in this row. R16.10 (no forbidden instruction in privileged-level Partition code) is the Link_Checker's."


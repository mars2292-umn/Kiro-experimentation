# ---------------------------------------------------------------- R17

[[row]]
requirement = 17
sentence = "A peripheral that moves data by itself (EasyDMA), bypassing memory protection, may only read and write its own Partition's ordinary memory; a request for any other buffer is refused before a byte moves, and a Partition's transfers are stopped before its memory is re-initialized."
implemented = "A Partition cannot write its DMA peripheral's pointer and count registers: its view maps that peripheral read-only. It asks the Kernel, which checks that the buffer lies in the Partition's RAM above the stack and then writes the registers itself (`dma_request_core` in crates/rsk-kernel/src/arch/cm4/entry.rs; the buffer test is `Layout::dma_permitted` in crates/rsk-logic/src/logic/mpu.rs). Only the SPIM class is supported; the Generator rejects the others."
strength = "weaker"
strength_note = "Close, since 2026-11-16, for R17.1 and R17.2: the request function is proven to accept a request exactly when the channel belongs to the executing Job's Partition and the buffer passes the test (non-empty, above the stack, inside the Partition's RAM, in no disabled part of it); an accepted request programs that channel's pointer and count registers with that buffer and nothing else, and a refused one programs nothing. Still weaker in three ways. The record of what was programmed is the Kernel's model of its own writes, not the peripheral: that EasyDMA then moves exactly those bytes is the vendor's documentation and the rig's cases. The other mediated service, the register write (`dma_write_core`), has the old kind of contract: that it never writes a pointer or count register is in its body, not in a postcondition. And nothing cited states R17.5 (no Job touches the buffer during a transfer)."
closed = "2026-11-06: a peripheral shortcut restarted a transfer after the Kernel had stopped it at a restart (one in ninety on the board); the stop now clears the shortcut first. 2026-11-13 (audit findings 1 and 10): the claim is limited to the SPIM class, and the read-only window is proven and checked at boot. 2026-11-16: the contract of `dma_request_core` did not state the refusal rule (found when this row was first written from the contract's text); it is now a postcondition, with three mutants killed."
gaps = "`dma_write_core` should state as a postcondition that it writes no pointer, count or list-mode register of any channel. R17.5 has no evidence cited here. That EasyDMA honours the registers as written is the vendor's documentation and the rig's cases. Other peripheral classes are out of scope in this version."


# ---------------------------------------------------------------- R29

[[row]]
requirement = 29
sentence = "The Analyzer computes for each Task a worst-case response time from Budgets, blocking, Kernel overheads and interference, as the least solution of the standard recurrence, and reports PASS only if every Task's bound is within its deadline. Property 18 says the bound is sound: no Job in an execution exceeds it."
implemented = "The recurrence's terms are derived from the Task_Model and the measured Kernel timing parameters (crates/rsk-analyzer/src/terms.rs), and the least fixed point is found by iteration on unsigned integers (crates/rsk-analyzer/src/rta.rs). Soundness against execution is proven in Lean over the same functions as compiled and the Kernel's functions as extracted (proofs/aeneas/lean/Rta/ and Sched/)."
strength = "weaker"
strength_note = "The computation is proven to be what it claims: the iteration returns the least fixed point of the terms it is given, or says 'not schedulable' with a value no fixed point is below. The term list is proven equal to a specification of the list, and that specification is the project's own formalization of R29.1's formula, so their agreement is by reading, with one test per term. Soundness (Property 18) is proven for a run with its own notion of time and four hand-written transitions, under listed conditions, one of which (one Budget event per Job) is a condition and not a consequence of the code. And the inputs are measurements: R29.1 takes C_i as the Budget, which R28.4 keeps above a measured maximum with a margin, not above a static bound."
closed = "2026-11-14 and 15: the Lean work found two terms the analysis lacked (timer entries of lower-Priority Tasks, and housekeeping) and one case the blocking term did not cover (a Budget event ahead of a pending dispatch); the terms were added and the Kernel changed. 2026-11-15: the utilization check of R29.9 was proven over the rationals."
gaps = "Not cited in this row, though proven: the derivation of each term from the model (`derive_all`), the rounding of R29.8, the overflow report of R29.6 and the utilization check of R29.9. Open: the run's time base, the four hand-written transitions, static worst-case execution times, and that the measured Kernel timing parameters are maxima and not bounds."

[[row.statement]]
file = "crates/rsk-analyzer/src/rta.rs"

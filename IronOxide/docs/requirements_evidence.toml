# ---------------------------------------------------------------- R7

[[row]]
requirement = 7
sentence = "The Kernel starts a released Job only when its Priority is above both the system ceiling and every Job in progress, always picks the highest-Priority such Job (lowest Task number on a tie), and when a Job ends resumes the one it preempted, last in, first out."
implemented = "Each Task has its own interrupt vector whose hardware priority is its Task Priority; the Kernel pends a vector when its Task's Job may start and sets the processor's priority mask (BASEPRI) from the ceiling, so the interrupt controller itself does the selection (crates/rsk-kernel/src/arch/cm4/entry.rs, `apply_core`). The rule the controller must realise is `Sched::eligible` and `Sched::select` in crates/rsk-logic/src/logic/sched.rs; the model of the controller is crates/rsk-logic/src/hw_model.rs."
strength = "weaker"
strength_note = "R7.1 to R7.3 are proven as a statement about a model of the interrupt controller: given the Kernel's state, vectors mapped as generated, no stale pending vector and the selected Task's vector pending, the controller takes that vector and no other. The definition of 'eligible' matches R7.1 word for word (pending Release, no Job in progress, Priority above the ceiling and above the Job on top). Weaker: the tie-break is 'lowest Task index', which is one fixed order and meets R7.3 only because the design records it as the chosen order; R7.4 (what may preempt), the register state of R7.5 and the timing of R7.8 are not in these statements (registers are restored by assembly, timing is measured); and 'no stale pending vector' is a premise the entry code is trusted to establish."
closed = "2026-11-06: a dispatch vector taken inside another handler's return window raised a UsageFault on the board; a fence and a deferral close the two windows (Verification_Plan 5.8a). 2026-11-13: the assembly stubs' instruction sequences are proven against a machine model."
gaps = "That the processor's interrupt controller behaves as the model (HW-01 to HW-05, HW-14) is by citation and differential tests. The stale-vector premise (A4) and that BASEPRI is written from the state after every transition are properties of the entry code, proven for the value and inspected for the write. Δ_dispatch, Δ_wake and Δ_complete are measured."


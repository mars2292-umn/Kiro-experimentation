# ---------------------------------------------------------------- R42

[[row]]
requirement = 42
sentence = "A message between Partitions carries only plain data, is copied so that neither side can write the other's memory, is validated by the receiver when it comes from a lower-criticality Partition, and a stopped or restarted peer is reported to the other side."
implemented = "Payload types must derive `rsk::Plain` (no references or pointers), checked by the derive and the Generator; the Kernel copies each message word by word between the Partition and Kernel-owned storage (crates/rsk-kernel/src/arch/cm4/entry.rs); receiver-side validation functions are declared in the App_Declaration and proven total by the Application prover; peer state is recorded by the Kernel at a stop or restart."
strength = "weaker"
strength_note = "No single formal statement covers this requirement. R42.1 is the type system's (a payload with a reference or a bool does not compile). R42.2 follows from isolation (R16: neither Partition can write the Kernel's storage or the other's memory) plus the copy, which is bounded-checked to stay in bounds and round-trip its words. R42.4's validation functions are proven free of run-time errors, which is totality, not that they reject every bad message. R42.3 (the peer-state error) is in the entry code and the role API, with tests, and is an assumption of the deadlock-freedom argument for a stop or restart."
closed = ""
gaps = "The peer-state report after a Partition's stop or restart (A-P6) has test evidence only. What a validation function accepts is the Application's choice."


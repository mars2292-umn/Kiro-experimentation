# The hand-written half of docs/requirements_evidence.md (`cargo xtask reqdoc`).
#
# One [[row]] per requirement. The sentences are plain English, written by a
# person who read the cited statement's text: `says` paraphrases what the
# statement states (not its name, not its comment), and `strength` judges
# the statements against the requirement's own words.
#
# [[row.statement]]: file, name, tool (verus | lean | kani), says, reviewed.
#   body = true  when the statement is a definition whose body is its meaning
#                (a spec function); otherwise the contract or theorem
#                statement up to the body or proof is what counts.
#   after = "..." text the search starts after, when a file has two items of
#                the name.
#   reviewed     the hash of the statement's text when `says` and the row's
#                judgment were written. `cargo xtask reqdoc --hashes` prints
#                the present ones. Change it only after reading the row
#                against the new text.
# [[row.other]]: kind (checked | tested-qemu | tested-rig | tested-host |
#   inspected | assumed), ref (an identifier written in the
#   Verification_Plan, the registers, the Profile or the design), note.
#
# strength: "yes" | "weaker" | "no".

schema = 1

# ---------------------------------------------------------------- R10

[[row]]
requirement = 10
sentence = "When an event arrives for a sporadic Task, the Kernel releases the Task only if no Release is waiting and at least one minimum inter-arrival time (MIT) has passed since the last one; otherwise it holds the event to the end of the MIT or drops it, records a violation, and applies the Partition's fault response once the violations pass a declared threshold."
implemented = "The Kernel's intake function decides accept, defer or discard from the Task's last accepted instant and its MIT, counts the violation against the source's Partition, and masks the source for one MIT after every outcome (crates/rsk-logic/src/logic/kernel.rs, `Kernel::intake`; the timing record in logic/time.rs). The interrupt handler that calls it, and which Partition it names as the source, are in crates/rsk-kernel/src/arch/cm4/entry.rs and the generated tables."
strength = "weaker"
strength_note = "The statements cover R10.1 to R10.4 on the Kernel's state machine, with one difference in each direction. Weaker: time is the reading the Kernel takes when its handler runs, so a Release becomes due at that reading and not at 'the instant of the event' as R10.1 says; the two differ by the handler's latency, which is measured on the board and not proven. The Partition a violation is charged to is an argument of the function, so R10.7's choice of Partition is decided by the caller and the generated tables, not by these statements. Nothing cited here states R10.5 (Release_Signals), R10.6 (effective within J_rel) or R10.8 (messages kept in the Endpoint buffer). Narrower by decision: an event whose Job could not finish within the operating duration is not released; the requirement's note of 2026-11-13 says so."
closed = "2026-11-05: a discarded event left its interrupt source unmasked, so a source could fire again inside the MIT; every outcome now masks the source, and the count of intakes in any window is proven (`lemma_intake_count_bound`)."
gaps = "The handler's latency from the event to the reading (J_rel, Δ_stamp) is measured, not bounded statically. Attribution of a violation to the right Partition rests on the generated tables and inspection of the entry code. The hardware half of masking an interrupt source is by inspection (ASM-10). R10.5 and R10.8 have tests and no proof cited here. In the Lean run the MIT spacing is a condition of the run, not derived from the code, because the run's instants are not tied to the Kernel's readings."


name = "pop"
tool = "verus"
says = "If it returns a slot, the queue was not empty, the slot is the oldest, and the queue's sequence is the old one without its first element; if it returns nothing, the queue was empty and is unchanged."
reviewed = "dcb9e455b682a873"


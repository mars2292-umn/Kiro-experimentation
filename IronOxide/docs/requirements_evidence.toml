# ---------------------------------------------------------------- R18

[[row]]
requirement = 18
sentence = "Each Job's execution time is counted against its Budget, an overrun is detected and answered as its Partition declared, and as a result a Partition that keeps to its Budgets meets the response times the Analyzer computed whatever lower-criticality Partitions do."
implemented = "The Kernel charges the executing Job the processor cycles between switch points and arms a timer event for the instant its Budget would run out; the event reports the Overrun and applies the response (`Kernel::timer_event`, `budget_event`, `settle` in crates/rsk-logic/src/logic/kernel.rs; the cycle counter and the charge points in crates/rsk-kernel/src/arch/cm4/entry.rs). The protection claim (R18.7) is the Analyzer's bound, proven over a run of the Kernel's functions in proofs/aeneas/lean/Sched/."
strength = "weaker"
strength_note = "R18.1: the statement is that a timer entry charges the executing Job exactly the cycles it is given and no other Task anything. The cycles it is given are wall-clock cycles since the last switch, so the Kernel's own work during an interrupting entry is charged to the interrupted Job; the requirement's note of 2026-11-13 accepts this within Δ_entry per entry, and it is why measured maxima move by a whole entry. R18.2 and R18.3: an Overrun that the Budget event finds is reported and answered, once; no statement bounds how soon (Δ_detect, Δ_enforce are measured). R18.7: the Lean theorem bounds the response of every Job of a Task the analysis calls schedulable, but in a run whose instants are its own and with four kinds of transition still written by hand; and it bounds response by the computed R, which is the requirement, only under the conditions the run lists."
closed = "2026-11-02: timed events served for other Tasks were charged to the executing Job's account; found by measurement, closed by the contract of `timer_event`. 2026-11-05: an account that passed its Budget at a preemption was taken as already reported and the Job ran on; `Budget::reported` now records the report itself. 2026-11-15: a Budget event could be served ahead of a pending dispatch, a delay the blocking term did not cover; `settle` disarms the event when a dispatch is admitted."
gaps = "Δ_detect and Δ_enforce are measured with a margin, not bounded statically. Since 2026-11-16 the Lean run is joined to the Kernel's time base for periodic arrivals (Sched/Arrive.lean: an arrival is the Kernel's nominal instant and its spacing is derived); since 2026-11-17 for sporadic arrivals too (Sched/Sporadic.lean: an arrival is the instant the Kernel records for the accepted or deferred Release, its spacing derived from the extracted intake code); since 2026-11-17 no transition of the run is modelled by hand (every one that changes the Kernel's state carries the extracted function's result, so the nominal instants and the sporadic timing fields are the code's throughout); one unanswered pulse in an early hour-long run stays open. R18.5 and R18.6 are Generator rules with tests. The rig's demonstration (R18.8) is on one Application."


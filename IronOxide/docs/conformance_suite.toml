# Profile_Conformance_Suite register (R3.6, R3.7, R3.11; task 14.1).
#
# One case per active restriction and enforcement category (TS, MC, LN, LK)
# and one fault-injection case per restriction that lists RT. `cargo xtask
# verify` (step "Profile_Conformance_Suite") and `cargo xtask conformance`
# run every case and write one Evidence_Item per case, named as the
# Profile's `evidence` tables name it (`conf-PR-nn-cc`, `fi-PR-nn`), so
# `cargo xtask trace` sees them (R50.6).
#
# A case passes only when the check of its category rejects the program
# with a diagnostic naming the PR identifier (R3.6), or, for a
# fault-injection case, when the Health_Monitor's event log records the
# violation with the restriction's identifier (R3.9, R3.11). A case whose
# `kind` is "reason" is one the suite cannot provide; `reason` says why
# (R3.6 admits this) and its Evidence_Item is written as inconclusive.
#
# Kinds and their fields:
#   generator       the P1 demo's App_Declaration with `find` (exactly once)
#                   replaced by `replace`, run through the Generator's parser
#                   and validator (MC); `expect`: substrings of the rejection
#   compile-fail    `member` of xtask/fixtures/api-misuse checked with
#                   `cargo check`; must fail with every `expect` substring (TS)
#   lint            `file` of crates/rsk-lint/fixtures/ui linted in `scope` by
#                   the Profile_Lint (LN); `expect`: substrings of its output
#   build-check     `fixture` of xtask/fixtures checked by the Build_System's
#                   workspace checks (LN, LK); `expect`: diagnostic substrings
#   link-mutation   the P1 demo Flight_Build altered (`patch`: `bytes` written
#                   at `offset` of the first function symbol starting with
#                   `symbol`; `rename`: that symbol renamed `to`), then the
#                   Link_Checker must exit non-zero naming every `expect` (LK)
#   fault-injection the P1 demo built with the Partition `feature`, run on
#                   QEMU; the event log must hold an event of kind `event`
#                   carrying the restriction bit (RT)
#   reason          not provided; `reason` says why

schema = 1
declaration = "apps/p1-demo/decl/src/lib.rs"
binary = "p1-demo"


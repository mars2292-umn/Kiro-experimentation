note = "Verus checks every arithmetic operation and index of the exec code in `rsk-logic` and the `verus!` modules of `rsk-kernel` (R44.7); the Link_Checker's no-panic-path report classifies the residue (verification_plan.md 5.6)."

[[proof]]

# ================================================== RT (fault injection)

[[case]]
id = "fi-PR-12"
restriction = "PR-12"
category = "RT"
kind = "fault-injection"
feature = "fi-pr12"
event = 9
note = "control raises `tick` twice in one Job: the second Release falls due while echo's is pending and is counted as an MIT_Violation (R9.8)."

[[case]]
id = "fi-PR-15"
restriction = "PR-15"
category = "RT"
kind = "reason"
reason = "The Init_Arena option is not implemented in the P1 demo (no Partition declares `init_arena`), so no allocation after Init can be injected; the case follows the Init_Arena (task 10)."

[[case]]
id = "fi-PR-19"
restriction = "PR-19"
category = "RT"
kind = "fault-injection"
feature = "fi-pr19"
event = 1
note = "echo panics in its second Job: the panic handler's SVC reaches the Kernel, which logs EV_PANIC for the Partition and applies RESTART_PARTITION (R14.2)."

[[case]]
id = "fi-PR-22"
restriction = "PR-22"
category = "RT"
kind = "fault-injection"
feature = "fi-pr22"
event = 3
note = "echo writes the NVIC enable register from unprivileged Thread mode: a BusFault (DD-01, R16.10)."

[[case]]
id = "fi-PR-29"
restriction = "PR-29"
category = "RT"
kind = "fault-injection"
feature = "fi-pr29"
event = 2
note = "echo writes into Partition 1's RAM: a MemManage fault of Partition 0's MPU view (R16.4)."

# ================================================ Accepted Applications (R3.7)

[[accepted]]
variant = "Ravenscar"
binary = "p1-demo"
# Constructs the demo exercises: three Partitions (levels A, C, and B),
# periodic Tasks with offsets, a sporadic Task bound to an interrupt and one
# released by a Release_Signal, a Resource with a Critical_Section, a
# peripheral window, a Task with an active FP context (`filter`, R11), an
# EasyDMA peripheral with `rsk::dma_request` (the QEMU stand-in channel of
# CMSDK_GPIO0, DD-08), a safe-state hook. Not yet exercised (GAP-13): a
# cross-Partition Endpoint (Phase 4) and the Init_Arena.

[[accepted]]
variant = "Jorvik"
reason = "The Jorvik Profile_Variant is declared (profile.toml `variants`) but not implemented in v1: the Generator accepts `profile = Ravenscar` only."

# ======================================== Proof artifacts per PO restriction (R3.8, R3.10)
# Each PO evidence name of the Profile maps to the Verus items that carry the
# obligation; the suite checks that every item exists in the verified crates
# and that the Kernel_Proofs Evidence_Item passed, failing the job and
# naming the restriction otherwise (R3.10).

[[proof]]
evidence = "proof-kernel-pr02-task-set-stable"
restriction = "PR-02"
items = ["task_count", "inv"]
note = "The Task set is the immutable `Config` the Kernel borrows; `inv` carries no Task creation or removal."

[[proof]]

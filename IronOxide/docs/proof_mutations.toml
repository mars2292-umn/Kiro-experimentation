# Proof mutation register (R52.2 model and specification validation;
# verification_plan.md section 9.2). `cargo xtask mutations` applies each
# mutation to a copy of the tree, runs `cargo-verus verify` on `package`
# (default rsk-kernel), and fails unless Verus rejects the mutant with
# output containing every `expect` string. `cargo xtask mutations --check`
# (run by the repository checks) confirms that every `find` still occurs
# exactly once in its file.
#
# Fields: id; kills (the specification or lemma the mutation must trip);
# file; find (exact text, once in the file); replace; expect (substrings
# of the Verus output: take them from the failing clause's text, which
# Verus prints with the error, or from the file name); package (optional);
# prover (optional, `verus` or `creusot`: an App_Prover mutation names a
# proof member of proofs/creusot as its package and is killed when
# `cargo creusot -p <member>` fails with the expected text, 2026-11-09).
#
# The first seven reproduce the manual vacuity checks of 2026-10-11 to
# 2026-10-14 (verification_plan.md 9.2) or an equivalent of them; the rest
# cover `arch::bound`, `arch::cm4` (2026-10-22), and the ghost history and
# its theorems (tasks 4.11, 4.13, 4.14).

schema = 1


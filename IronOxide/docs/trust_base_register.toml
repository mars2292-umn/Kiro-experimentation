[[entry]]
id = "TBR-01"
component = "Compiler front end, LLVM back end, and LLVM integrated assembler: upstream rustc 1.95.0 (Phases P1-P4), the Verus_Toolchain rustc 1.98.1, and the Qualified_Toolchain (Ferrocene 26.05.0, Phase P5)"
trusted_for = "Translating verified source, and the naked-stub assembly of the Kernel_Unsafe_Module, into the Flight_Build faithfully."
why = "Every proof and source-level check is about source code; only the compiler and assembler connect it to the object code that runs, and no rsk tool checks that translation (ASM-09). The P1 spike found one silent assembler defect class: a `cbz`/`cbnz` to a symbol in another section assembles to a `nop` without a diagnostic (ORQ-32)."
evidence = "Ferrocene qualification (P5); HIL tests on the Flight_Build (hardware-pending, GAP-09); source-to-object traceability (R53.2); archived ghost-erased source (R55.3); dual build (R55.2); for the assembler, the ORQ-32 rule that naked stubs branch to each other with `b`/`b.w` only, and the planned Link_Checker disassembly of every naked stub (task 12.3); QEMU runs of the Flight_Build as pre-hardware evidence (TBR-23)."
residual_risk = "DAL A/B compiler assurance beyond Ferrocene's DAL C support (GAP-01); the verified and flight rustc versions differ; until the Link_Checker stub scan exists, the ORQ-32 rule is kept by review only."
requirements = ["R52.3", "R53.2", "R55", "R56"]
properties = ["all"]
links = ["ASM-09", "ORQ-04", "ORQ-08", "ORQ-32"]

[[entry]]
id = "TBR-02"
component = "Hardware_Model (crates/rsk-logic/src/hw_model.rs, rules HW-01 to HW-14): the interrupt-controller, MPU, FPU, and DWT semantics the Kernel_Proofs use under the revised DD-01, namely NVIC priority encoding and arbitration (HW-01, HW-05), execution priority, BASEPRI, PRIMASK, and FAULTMASK (HW-02 to HW-04), exception entry, return, tail-chaining, and late arrival (HW-06, HW-07, HW-14), privilege (HW-08), the MPU region decision for unprivileged accesses (HW-09), eager FP stacking (HW-10), precise BusFaults (HW-11), TIMER compare (HW-12), and DWT CYCCNT (HW-13)"
trusted_for = "Agreement between the model and the silicon on every behaviour the Kernel_Proofs use."
why = "The Kernel_Proofs reach the hardware only through these rules, and a model cannot validate itself against silicon (R52.2), so each rule is an assumption until its differential test passes on the Target."
evidence = "Manual citations per rule (R49.2); the list of behaviours not formalized, each with the reason no proof depends on it (R49.6); one HIL differential test per rule (R49.3; hardware-pending, GAP-09); the P1 dispatch spike, run on QEMU mps2-an386 (TBR-23)."
residual_risk = "Until boards are available no rule is validated on the Target, and QEMU differs from it (TBR-23); behaviours that tests cannot exercise exhaustively (rare late-arrival timings)."
requirements = ["R44", "R49"]
properties = ["P-02", "P-04", "P-07", "P-11", "P-16", "P-17", "P-18", "P-21", "P-25"]
links = ["ASM-03", "ASM-06", "ASM-08", "ASM-19", "ORQ-09", "ORQ-17", "ORQ-19"]

[[entry]]
id = "TBR-03"
component = "Silicon errata: Cortex-M4 r0p1 core errata and nRF52840 anomalies"
trusted_for = "Completeness of the workarounds the Kernel applies."
why = "The Hardware_Model describes the documented behaviour; an erratum the model omits would break a proof premise without any tool noticing (ASM-01)."
evidence = "Errata review recorded in the Hardware_Model (R49.4): erratum 838869 worked around by a DSB before every exception return, 752770 excluded by eager FP stacking (DD-04), nRF52840 anomalies 219, 223, and 230 confined to Partition-owned peripherals; the core revision and the 838869 applicability are confirmed on hardware by the boot check and the spike (hardware-pending, GAP-09)."
residual_risk = "Unpublished errata; the core revision is assumed, not yet read on a Target."
requirements = ["R11.6", "R49.4"]
properties = ["P-04", "P-11", "P-25"]
links = ["ASM-01", "ORQ-16"]


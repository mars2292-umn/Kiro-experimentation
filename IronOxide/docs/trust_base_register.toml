residual_risk = "SMT or Verus soundness defects; vstd axioms and its `assume_specification` items for `core` (crate entry vstd, TBR-09); ghost-erasure cfg flags (GAP-11); no DO-330 qualification (GAP-03); proof re-runs from archived inputs are not automated (GAP-16, R50.4)."

[[entry]]
id = "TBR-01"
component = "Compiler front end and LLVM back end: upstream rustc 1.95.0 (Phases P1-P4), the Verus_Toolchain rustc 1.98.1, and the Qualified_Toolchain (Ferrocene 26.05.0, Phase P5)"
trusted_for = "Translating verified source into the Flight_Build faithfully."
evidence = "Ferrocene qualification (P5); HIL tests on the Flight_Build; source-to-object traceability (R53.2); archived ghost-erased source (R55.3); dual build (R55.2)."
residual_risk = "DAL A/B compiler assurance beyond Ferrocene's DAL C support; the verified and flight rustc versions differ."
requirements = ["R52.3", "R55", "R56"]
links = ["ASM-09", "ORQ-04", "ORQ-08"]

[[entry]]
id = "TBR-02"
component = "Hardware_Model (crates/rsk-kernel/src/hw_model.rs), including NONBASETHRDENA exception returns"
trusted_for = "Agreement between the model and the silicon on every behaviour the Kernel_Proofs use."
evidence = "Manual citations per rule (R49.2); one HIL differential test per rule (R49.3); the P1 dispatch spike before the Kernel depends on it; QEMU (mps2-an386) runs of the same tests as a pre-hardware check."
residual_risk = "Behaviours that tests cannot exercise exhaustively (rare late-arrival timings); QEMU is not the Target."
requirements = ["R44", "R49"]
links = ["ASM-08", "ORQ-09", "ORQ-19"]

[[entry]]
id = "TBR-03"
component = "Silicon errata: Cortex-M4 r0p1 core errata and nRF52840 anomalies"
trusted_for = "Completeness of the workarounds the Kernel applies."
evidence = "Errata review recorded in the Hardware_Model (R49.4); DSB before exception return; eager FP stacking."
residual_risk = "Unpublished errata."
requirements = ["R11.6", "R49.4"]
links = ["ASM-01", "ORQ-16"]

[[entry]]
id = "TBR-04"
component = "Verus 0.2026.10.04 with Z3 4.16.0, vstd, and every `external_body`, `assume_specification`, `assume`, and `admit` item"

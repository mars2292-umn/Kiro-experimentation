why = "Verus is the tool that claims DO-333 credit for the Kernel logic and the Analyzer's fixed-point core (verification_plan.md 8.3); an unsound solver answer, axiom, or assumption would make a proof vacuous, and no DO-330 qualification of Verus exists (ORQ-06)."

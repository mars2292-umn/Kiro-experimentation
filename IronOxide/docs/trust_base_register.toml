[[entry]]
id = "TBR-19"
component = "Build_System (xtask): reproducible builds, gates, and verdict aggregation"
trusted_for = "Correct verdicts and bit-identical rebuilds."
why = "The verification job runs every tool, applies the assumption, dependency, and register gates, aggregates the verdicts, and writes the Evidence_Items; a scripting error could report a pass that no tool gave."
evidence = "Rebuild comparison (R59.3); archived Evidence_Items and logs; the Build_System's own fixture tests (xtask/tests/fixtures.rs), with a failing fixture per gate; the registers checked against requirements.md, design.md, and the Verification_Plan (R48, R54)."
residual_risk = "Pipeline scripting errors; proof re-runs from archived inputs are not automated (GAP-16)."
requirements = ["R50", "R59"]
properties = ["all"]
links = []

[[entry]]
id = "TBR-20"
component = "Single-core execution"
trusted_for = "Every Kernel proof."
why = "v1 targets one Cortex-M4F core (NG-01); the proofs model one execution context at a time and would not hold with a second core."
evidence = "Explicit precondition in the proofs (R27.4); rejection of more than one core by the Generator, the Analyzer, and the Config_Checker is planned (task 10.7)."
residual_risk = "None in v1."
requirements = ["R27.4"]
properties = ["all"]
links = []

[[entry]]
id = "TBR-21"
component = "Rust type system: Send/Sync data-race freedom and borrow checking in safe code"
trusted_for = "Data-race freedom of Application and Kernel code outside the Kernel_Unsafe_Module."
why = "Data-race freedom of safe code and the lock scoping of the `rsk` API come from the type checker, not from a proof (R43.3)."
evidence = "Sound `unsafe` code (TBR-05, TBR-06) and a correct compiler (TBR-01)."
residual_risk = "A compiler or `unsafe` soundness defect."
requirements = ["PR-05", "R43.3"]
properties = ["P-01", "P-03", "P-22"]
links = ["ASM-14"]

[[entry]]
id = "TBR-22"
component = "Static_WCET_Analyzer (not selected; Phase P5)"
trusted_for = "Safe upper bounds on the execution time of Jobs and Kernel paths, as the cross-check that makes measured WCETs adequate (ORQ-13)."
why = "Measurement-based WCET is not a bound (ASM-11); guaranteed timing in P5 rests on a static analysis whose processor, memory, and bus model of the Target is trusted."
evidence = "None yet: no tool is selected (ORQ-12, task 24.1). Selection requires acceptance of exported loop bounds and indirect-call targets, and its bounds are cross-checked against the measurements (R36)."
residual_risk = "Until P5 no static bound exists (GAP-04); after selection, the tool's model of the Target and its qualification (verification_plan.md 8.1)."
requirements = ["R36"]
properties = ["P-20"]
links = ["ASM-04", "ASM-07", "ORQ-12", "ORQ-13"]

[[entry]]
id = "TBR-23"
component = "QEMU (qemu-system-arm, machine mps2-an386; 9.2.3 on the local run of 2026-10-14) running Flight_Build binaries in `cargo xtask qemu` and step 10b of the verification job"
trusted_for = "That a pass shows the dispatch, lock, view-switching (with a Partition peripheral window since 2026-10-23), FP-stacking, Job-end, peripheral-interrupt intake, MIT masking and unmasking, and unprivileged peripheral-window access paths of the Flight_Build execute as designed before hardware exists; never that the Target behaves the same."
why = "No nRF52840-DK is available (2026-10-14), so QEMU runs are the only execution evidence of the Flight_Build. QEMU differs from the Target in its timer (CMSDK, not the nRF TIMER), priority bits (8, not 3), cycle counting (none), EasyDMA (absent), errata (not modelled), and the nRF52840 CLOCK, NVMC cache, POWER.RESETREAS, and WDT registers (absent: the clock and cache boot checks are skipped on the QEMU board, the watchdog writes go to unmapped space, and a watchdog reset cannot be exercised)."
evidence = "Evidence_Item `test-qemu-spike-p1-demo` records the QEMU version and the command line (since 2026-10-23 with `-icount shift=auto,sleep=off`, so that guest time follows the instruction count and a busy host or a semihosting write cannot eat into the Jobs' deadlines); the run passes only on semihosting exit code 0 with `RSK-OK`, after the demo has checked its Job counts, faults, and misses; every claim it supports also names its hardware test (verification_plan.md section 11)."
residual_risk = "A QEMU modelling defect or a Target difference listed above could make a pass meaningless for the Target, which is why QEMU results never replace HIL evidence (GAP-09). The QEMU version is recorded but not pinned, and CI does not install QEMU, so a CI run carries no QEMU item."
requirements = ["R49.3", "R50.1"]
properties = ["P-04", "P-10", "P-11"]
links = ["ASM-08", "ORQ-01", "ORQ-09"]

[[entry]]
id = "TBR-24"
component = "Kernel_Arch outside `verus!`: the shells of crates/rsk-kernel/src/arch/cm4/mod.rs (fetch, call the verified core, enter the safe state), the `System` trait and its `Tables` adapter, rsk-entry, and the five trusted functions of `Cm4Hw` (arch/cm4/entry.rs: `apply`, `now`, `cycles`, `boot_checks`, `boot_info`; docs/proof_assumptions.toml), with the facts of verification_plan.md section 4 that remain by inspection (A2 in the stubs, A7, A8, A10, the call order of rsk-entry for A11). Since 2026-10-22 the bound Kernel (arch/bound.rs), the planning computations (arch/cm4/plan.rs), and every entry point (arch/cm4/entry.rs) are inside `verus!` (task 5.7)."
trusted_for = "That `Cm4Hw::apply` performs each `Action` as exactly the register-access function the ghost `HwModel` step names (BASEPRI, NVIC, MPU, TIMER, the frame write), that the four reads return the hardware's values, that the shells call the cores with the Kernel cell, the tables, and the Kernel_Arch state and enter the safe state when told, and that the Kernel cell is never entered reentrantly."
why = "Kernel_Arch is safe Rust outside `verus!`, so Verus checks neither that its calls satisfy the logic's preconditions nor that it realises the proven decisions on the hardware; the hardware-level properties are proven only given A1 to A11. This is a deviation from R44.5, which allows unproven Kernel code only for functions with trusted specifications."
evidence = "Verus (2026-10-22): A9 is proven (every call from `Bound` into the logic is checked against its `requires`), the values of A1 and A3 (`basepri_now`, `encode_level`) and the eligibility test and selection of A4 are proven computations, and the views of A6 are `is_view_of` in `Bound::inv`; the proof mutations `bound-dispatch-unguarded` and `basepri-lower-level` (docs/proof_mutations.toml) show these specifications can fail. Inspection of the remaining facts against the code, recorded with its location (verification_plan.md section 4, 2026-10-11 to 2026-10-14, re-checked 2026-10-22); review records UJ-003 to UJ-006 for reentrancy (A10); the rsk-gen test `dispatch_irqs_ascend_for_dd03` for the vector order (A12); the QEMU spike (TBR-23)."
residual_risk = "An inspection error in the facts that remain by inspection (the register writes of A1 and A3, A2, A5, A7, A8, A10, the call order of A11), or a later change that breaks one without re-inspection, would leave the hardware-level proofs without their premises; the inspection is by the author (GAP-08). Mitigation: move `arch::cm4` into `verus!` with a `KernelArch::apply` specification tied to the Hardware_Model (GAP-10)."
requirements = ["R44.1", "R44.4", "R44.5"]
properties = ["P-02", "P-03", "P-04", "P-05", "P-07", "P-08", "P-09", "P-10", "P-12", "P-14", "P-16", "P-17", "P-18", "P-21"]
links = ["ASM-08", "ORQ-01", "ORQ-07"]


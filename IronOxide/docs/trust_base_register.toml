[[entry]]
id = "TBR-12"
component = "Analyzer, Config_Checker, Link_Checker (including any static check used as partitioning evidence, R16.10, and the naked-stub disassembly of ORQ-32), WCET_Harness, Profile_Lint, Protocol_Checker"
trusted_for = "Correct verification verdicts."
why = "Their verdicts replace or reduce review and testing: schedulability, configuration consistency, link-level absence of panic paths (ORQ-07) and of forbidden instructions, stack bounds, WCET measurements, Profile conformance, and protocol compliance. A false pass would hide a defect."
evidence = "Analyzer fixed-point core proved in Verus (R32.1); property-based tests; independence of the Config_Checker from the Generator (R26.1); LK backing for lints; differential runs. Under DD-01 every access class of every Partition is hardware-enforced (ORQ-28), so R16.10 has no instance in v1 and the Link_Checker's partitioning scans are defence in depth, not partitioning evidence."
residual_risk = "Tool defects in unproved parts, including the Analyzer's term derivation; as of 2026-10-23 the Analyzer, the Config_Checker (task 13, with its mutation suite), the Link_Checker (tasks 12.1 to 12.3: stack bounds, instruction-class and symbol scans, Core_Subset mapping, no-panic-path report, each check with a fixture), and the Profile_Lint (task 11.1: a `syn`-based source lint, one UI fixture per lint, plus Clippy's deny-lists; it sees syntax, not types, so method calls on `core` types are the Link_Checker's) exist; the WCET_Harness and the Protocol_Checker are stubs or absent (GAP-13). The Link_Checker's frame model (sum of SP decrements per function) and its indirect-call universe (function addresses in the data sections) are over-approximations whose soundness rests on the compiler's prologue discipline and on every indirect target being stored in the image; neither is proven."
requirements = ["R16.10", "R26.1", "R32", "R51"]
properties = ["P-01", "P-12", "P-15", "P-16", "P-19", "P-20", "P-21", "P-22"]
links = ["ORQ-07", "ORQ-11", "ORQ-28", "ORQ-32"]


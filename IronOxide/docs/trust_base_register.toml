trusted_for = "Correct Generated_Config."
why = "The Generated_Config (Task_Model, MPU layout, dispatch-vector assignment, CONFIG) is the input of the boot checks, the Analyzer, and the MPU proofs, and the Generator itself is not proven. Since 2026-10-23 the Config_Checker (rsk-confcheck, task 13.1) recomputes the derived values of R26.2 from the declared ones with its own parser and compares them with the Task_Model and with the CONFIG tables and checksum extracted from every Flight_Build binary (verify step 8b), so the trust reduces to the declared values and the outputs R26.2 does not cover (verification_plan.md 8.2); the LAYOUT joined the comparison the same day (RSK_LAYOUT_IMAGE, task 13.2) and the mutation suite of R26.7 reports every altered value class."
evidence = "Config_Checker recomputation and mutation suite (R26.7; not built, GAP-13); review of the configuration summary (R24.3); boot-time validation of the tables (`Config::validate`, `Layout::validate`, proven); the rsk-gen test `dispatch_irqs_ascend_for_dd03`; drift check (`gen --check`)."
residual_risk = "Outputs the Config_Checker does not cover (listed per R51.3, verification_plan.md 8.2)."
requirements = ["R24.3", "R26", "R51.3"]
properties = ["P-04", "P-14", "P-15", "P-16", "P-19"]

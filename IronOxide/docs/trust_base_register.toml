# Trust_Base_Register v1 (R48). This file is the register: there is no
# rendered copy. Design source: design.md, "Trust-Base Analysis".
#
# Two parts are checked by the Build_System:
# - the [[crate]] entries gate the Flight_Build dependency graph (R58.2,
#   R58.5, `checks::deps`): every third-party crate that a Flight_Build
#   compiles and that contains `unsafe` code, assembly, a build script, or a
#   proc-macro needs an entry for its exact version;
# - the [[entry]] tables cover the other trusted components, and the
#   [[r48_1]] table maps every item that R48.1 lists to the entries that
#   cover it (`checks::registers`, R48).
#
# Field meaning (R48.2, R48.3): `trusted_for` is what the argument assumes of
# the component; `why` is why the argument has to trust it; `evidence` is
# what reduces that trust; `residual_risk` is what remains; `requirements`
# and `properties` are what depends on the entry (properties are the P-nn
# rows of docs/verification_plan.md section 3, or "all"); `links` are the
# ASM and ORQ identifiers. GAP-nn identifiers point into
# docs/gap_register.toml. The assumption annex of TBR-04 is
# docs/proof_assumptions.toml (R50.2).
#
# `cargo xtask check` fails when a field is missing, when an identifier does
# not resolve against requirements.md, design.md, the Verification_Plan, or
# the Gap_Register, or when an R48.1 item is not mapped.

schema = 1
version = "1.1"
updated = "2026-10-14"


# Trust_Base_Register source (R48). `cargo xtask docs` renders it to
# docs/trust_base_register.md. The verification job reads the [[crate]]
# entries to gate the Flight_Build dependency graph (R58.2, R58.5): every
# third-party crate that a Flight_Build compiles and that contains `unsafe`
# code, assembly, a build script, or a proc-macro needs an entry for its
# exact version. The [[entry]] tables cover the other trusted components.
#
# Field meaning (R48.2, R48.3): `trusted_for` is what the argument assumes of
# the component; `evidence` is what reduces that trust; `residual_risk` is
# what remains; `requirements` and `properties` are what depends on the
# entry; `links` are the ASM and ORQ identifiers.

schema = 1
version = "1.0"
updated = "2026-10-08"

# ---------------------------------------------------------------------------
# Third-party crates of the Flight_Build graph
# ---------------------------------------------------------------------------

[[crate]]
name = "vstd"
version = "0.0.0-2026-10-04-0306"
role = "Kernel Target graph (no_std, no alloc); verification build"
contains = ["unsafe", "build script"]
trusted_for = "The specifications it gives to `core` items (`assume_specification`), its axioms, and the soundness of its verified lemmas; in a Flight_Build, the executable code of the vstd items the Kernel calls."
evidence = "Pinned exact version matching the Verus release (toolchain/decision.toml); ghost erasure leaves no vstd symbol in the Kernel Flight_Build, which the Link_Checker checks (R55.4); the build script only sets RUST_MIN_STACK (reviewed); `unsafe` code sits in raw-pointer and atomic wrappers that the Kernel does not use."
residual_risk = "An unsound vstd axiom or `assume_specification` would make a Kernel proof vacuous; no DO-330 qualification exists."
requirements = ["R44.5", "R44.6", "R55.4", "R50.2"]
links = ["ASM-15", "ORQ-07", "ORQ-08"]


[package]
name = "p1-demo-part1-proof"
description = "Creusot proof of the P1 demo's Partition 1 Task bodies (the real source, compiled under the App_Prover)"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "../../../apps/p1-demo/part1/src/lib.rs"

[dependencies]
p1-demo-decl = { path = "../../../apps/p1-demo/decl" }
rsk = { path = "../../../crates/rsk", features = ["creusot"] }
creusot-std = { git = "file:///Users/mars2292/repos/Kiro-experimentation/creusot", rev = "18f2d371ecb0019d37ecbd25e67f474bed2dda00" }

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(creusot)"]

# The Partition's features as the QEMU configuration enables them (the others
# named so that the compiler knows them). Task 21.7 follow-up (2026-11-09):
# `log` is the Job whose `pingpong` receive gates its `relay` operations
# (A-P8), proven here with the body.
[features]
default = ["telemetry", "qemu-inject", "gating"]
telemetry = []
qemu-inject = []
gating = ["telemetry"]
qemu-flood = []
nrf52840 = []
response = []
isolation = []
cycles = []
stress = []
measure = []

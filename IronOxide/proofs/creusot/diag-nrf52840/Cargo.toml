[package]
name = "pacemaker-diag-nrf52840-proof"
description = "Creusot proof of the PACEMAKER experiment's Partition diag: the Task history and what it keeps (the real source, compiled under the App_Prover; docs/pacemaker, 2026-11-25)"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "../../../apps/pacemaker/diag/src/lib.rs"

[dependencies]
pacemaker-decl = { path = "../../../apps/pacemaker/decl", features = ["nrf52840"] }
pm-core = { path = "../../../crates/pm-core", features = ["creusot"] }
rsk = { path = "../../../crates/rsk", features = ["creusot"] }
creusot-std = { git = "file:///Users/mars2292/repos/Kiro-experimentation/creusot", rev = "18f2d371ecb0019d37ecbd25e67f474bed2dda00" }

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(creusot)"]

# The Partition's feature as the board's build enables it.
[features]
default = ["nrf52840"]
nrf52840 = []
